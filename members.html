<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SSCC MEMBERS</title>
    <style>
        :root {
            --bg: #000;
            --card: #111;
            --accent: #3b82f6;
            --text: #eee;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }

        header {
            padding: 10px 0;
            text-align: center;
            border-bottom: 1px solid #222;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent);
        }

        #player-list-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .player-row {
            background: #0a0a0a;
            padding: 15px;
            border-bottom: 1px solid #222;
            border-radius: 4px;
        }

        .player-name {
            font-weight: bold;
            font-size: 1rem;
        }

        .player-stats {
            font-size: 0.75rem;
            color: #888;
            margin-top: 4px;
        }

        .loading {
            text-align: center;
            color: #555;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>SSCC MEMBERS</h1>
    </header>

    <div id="player-list-container">
        <div class="loading">Loading members...</div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwICYY6WRDzPPXbO70Fxa9eGz4qWREHX7pEXGozNR_QYfeHHBFDciPGy2Cwhbpq7AUQZQ/exec';

        async function loadPlayers() {
            const container = document.getElementById('player-list-container');
            try {
                const resp = await fetch(SCRIPT_URL, { method: 'GET', mode: 'cors' });
                if (!resp.ok) throw new Error();
                const allPlayers = await resp.json();

                container.innerHTML = allPlayers
                    .filter(p => p && p[0] && p[0].trim() !== '')
                    .map(p => {
                        let stats = [];
                        if (p[1]) stats.push(`Reg: ${p[1]}`);
                        if (p[2]) stats.push(`Quick: ${p[2]}`);
                        if (p[3]) stats.push(`Blitz: ${p[3]}`);

                        return `
                        <div class="player-row">
                            <div class="player-name">${p[0]}</div>
                            ${stats.length ? `<div class="player-stats">${stats.join(' | ')}</div>` : ''}
                        </div>`;
                    }).join('');
            } catch (e) {
                container.innerHTML = '<div class="loading" style="color:#ef4444;">Failed to load. Check connection.</div>';
            }
        }

        window.onload = loadPlayers;
    </script>
</body>

</html>
