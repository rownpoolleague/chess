<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SSCC MEMBERS</title>
    <style>
        :root {
            --bg: #000;
            --card: #111;
            --accent: #3b82f6;
            --text: #eee;
        }

        /* Forces borders and padding to stay internal to layout dimension boundaries */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #111;
            overflow: hidden; /* Prevents layout bounce scrolling on mobile devices */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .form-wrapper {
            width: 100%; 
            height: 100dvh; 
            border: 4px solid #1e90ff;
            border-radius: 0; 
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Absolutely locks the frame boundaries */
            
            /* Accounts for physical notches and home bar overlays in true fullscreen mode */
            padding-top: env(safe-area-inset-top, 2px);
            padding-bottom: env(safe-area-inset-bottom, 2px);
            padding-left: env(safe-area-inset-left, 2px);
            padding-right: env(safe-area-inset-right, 2px);
        }

        .engine-box { 
            flex: 1;
            background: var(--bg); 
            padding: 15px; 
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Vertically scroll inside the blue frame boundaries if roster grows */
            overflow-x: hidden; /* Suppresses horizontal scrolling safely */
        }

        header {
            padding-bottom: 12px;
            border-bottom: 1px solid #222;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .nav-button {
            background: #1e90ff;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
        }

        #player-list-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }

        .player-row {
            background: #0a0a0a;
            padding: 15px;
            border-bottom: 1px solid #222;
            border-radius: 4px;
            display: flex;
            justify-content: space-between; /* Horizontal split: name on left, ratings on right */
            align-items: center;
            width: 100%;
            gap: 10px;
            flex-wrap: wrap; /* Allows ratings to drop below name cleanly only if screen is extremely narrow */
        }

        .player-name {
            font-weight: bold;
            font-size: 1rem;
            color: var(--text);
            word-break: break-word; /* Prevents long names from pushing past the container boundary */
        }

        .player-stats {
            font-size: 0.75rem;
            color: #888;
            text-align: right;
            margin-left: auto; /* Keeps stats pushed to the far right side */
        }

        .loading {
            text-align: center;
            color: #555;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="form-wrapper">
        <div class="engine-box">
            <header>
                <h1>SSCC MEMBERS</h1>
                <a class="nav-button" href="index.html" onclick="goTo(event, this.href)">Main Menu</a>
            </header>

            <div id="player-list-container">
                <div class="loading">Loading members...</div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwICYY6WRDzPPXbO70Fxa9eGz4qWREHX7pEXGozNR_QYfeHHBFDciPGy2Cwhbpq7AUQZQ/exec';

        // Forces navigation to load smoothly inline inside the standalone fullscreen container app
        function goTo(event, url) {
            event.preventDefault();
            window.location.href = url;
        }

        async function loadPlayers() {
            const container = document.getElementById('player-list-container');
            try {
                const resp = await fetch(SCRIPT_URL, { method: 'GET', mode: 'cors' });
                if (!resp.ok) throw new Error();
                const allPlayers = await resp.json();

                container.innerHTML = allPlayers
                    .filter(p => p && p[0] && p[0].trim() !== '')
                    .map(p => {
                        let stats = [];
                        if (p[1]) stats.push(`Reg: ${p[1]}`);
                        if (p[2]) stats.push(`Quick: ${p[2]}`);
                        if (p[3]) stats.push(`Blitz: ${p[3]}`);

                        return `
                        <div class="player-row">
                            <div class="player-name">${p[0]}</div>
                            ${stats.length ? `<div class="player-stats">${stats.join(' | ')}</div>` : ''}
                        </div>`;
                    }).join('');
            } catch (e) {
                container.innerHTML = '<div class="loading" style="color:#ef4444;">Failed to load. Check connection.</div>';
            }
        }

        window.onload = loadPlayers;
    </script>
</body>

</html>
