<!DOCTYPE html>
<html lang="en">

<head>
    <script src="config/appConfig.js"></script>

    <meta charset="UTF-8">
    <!-- viewport-fit=cover tells the browser engine to use the absolute hardware screen edges -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- THESE TWO META TAGS FORCE IOS TO STOP SHRINKING THE APP CANVAS ON LOAD -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>SSCC MEMBERS</title>
    <style>
        :root {
            --bg: #000;
            --card: #111;
            --accent: #3b82f6;
            --text: #eee;
        }

        /* Forces borders and padding to stay internal to layout dimension boundaries */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            /* Dynamic viewport height locks perfectly to standalone app boundaries */
            background-color: #000;
            overflow: hidden;
            /* Prevents layout bounce scrolling on mobile devices */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .form-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100dvh;
            border: 4px solid #1e90ff;
            border-radius: 12px;
            /* Smoothly curves all four corners */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Ensures child elements don't spill past the curved corners */

            /* Safe area padding keeps content cleanly out of the notch area while the border stays pinned to the glass edge */
            padding-top: env(safe-area-inset-top, 4px);
            padding-bottom: env(safe-area-inset-bottom, 4px);
            padding-left: env(safe-area-inset-left, 4px);
            padding-right: env(safe-area-inset-right, 4px);
        }

        .engine-box {
            flex: 1;
            background: var(--bg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            /* Vertically scroll inside the blue frame boundaries if roster grows */
            overflow-x: hidden;
            /* Suppresses horizontal scrolling safely */
        }

        header {
            padding-bottom: 12px;
            border-bottom: 1px solid #222;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .nav-button {
            background: #1e90ff;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
        }

        #player-list-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }

        .player-row {
            background: #0a0a0a;
            padding: 15px;
            border-bottom: 1px solid #222;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
            flex-wrap: wrap;
        }

        .player-name {
            font-weight: bold;
            font-size: 1rem;
            color: var(--text);
            word-break: break-word;
        }

        .player-stats {
            font-size: 0.75rem;
            color: #888;
            text-align: right;
            margin-left: auto;
        }

        .loading {
            text-align: center;
            color: #555;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="form-wrapper">
        <div class="engine-box">
            <header>
                <h1>SSCC MEMBERS</h1>
                <a class="nav-button" href="index.html" onclick="goTo(event, this.href)">Main Menu</a>
            </header>

            <div id="player-list-container">
                <div class="loading">Loading members...</div>
            </div>
        </div>
    </div>

    <script>
        

        function goTo(event, url) {
            event.preventDefault();
            window.location.href = url;
        }

        async function loadPlayers() {
            const container = document.getElementById('player-list-container');
            try {
                const resp = await fetch(APP_CONFIG.SCRIPT_URL, {
                    method: 'GET',
                    mode: 'cors'
                });
                if (!resp.ok) throw new Error();
                const allPlayers = await resp.json();

                container.innerHTML = allPlayers
                    .filter(p => p && p[0] && p[0].trim() !== '')
                    .map(p => {
                        let stats = [];
                        if (p[1]) stats.push(`Reg: ${p[1]}`);
                        if (p[2]) stats.push(`Quick: ${p[2]}`);
                        if (p[3]) stats.push(`Blitz: ${p[3]}`);

                        return `
                        <div class="player-row">
                            <div class="player-name">${p[0]}</div>
                            ${stats.length ? `<div class="player-stats">${stats.join(' | ')}</div>` : ''}
                        </div>`;
                    }).join('');
            } catch (e) {
                container.innerHTML = '<div class="loading" style="color:#ef4444;">Failed to load. Check connection.</div>';
            }
        }

        window.onload = loadPlayers;
    </script>
</body>

</html>
