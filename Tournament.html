<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOURNAMENT ENGINE</title>
    <style>
        :root { --bg: #000; --card: #111; --accent: #3b82f6; --text: #eee; --go: #22c55e; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 15px; }
        .engine-box { background: var(--card); padding: 15px; border: 1px solid #222; border-radius: 6px; }
        select { width: 100%; padding: 10px; background: #181818; border: 1px solid #333; color: white; border-radius: 4px; margin-bottom: 10px; }
        .action-btn { width: 100%; padding: 12px; background: var(--go); border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .pair-btn { background: var(--accent); color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 0.7rem; }
    </style>
</head>
<body>

<div class="engine-box">
    <div style="color: var(--accent); font-weight: bold; margin-bottom: 10px;">🏆 TOURNAMENT ENGINE</div>
    
    <select id="tourney-format">
        <option value="round-robin">Round Robin (All-Play-All)</option>
        <option value="elo-proximity">Swiss / ELO Proximity</option>
    </select>
    
    <button class="action-btn" onclick="startNewTournament()">START TOURNAMENT</button>

    <div id="tourney-roster-section" style="margin-top: 15px;">
        <div style="font-size: 0.7rem; color: #888; margin-bottom: 5px;">SELECT PLAYERS:</div>
        <div id="tournament-roster" style="max-height: 550px; overflow-y: auto; background: #000; padding: 10px; border-radius: 4px;"></div>
    </div>

    <div id="tourney-active-dashboard" style="display: none; margin-top: 15px;">
        <div style="display: flex; justify-content: space-between; align-items: center; background: #222; padding: 10px; border-radius: 4px;">
            <span id="current-round-display" style="font-weight: bold;">Round 1</span>
            <div>
                <button onclick="changeRound(-1)">◀</button>
                <button onclick="changeRound(1)">▶</button>
            </div>
        </div>
        <div id="active-pairings-list" style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;"></div>
    </div>
</div>

<script>
    // Replace with your actual script URL
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwICYY6WRDzPPXbO70Fxa9eGz4qWREHX7pEXGozNR_QYfeHHBFDciPGy2Cwhbpq7AUQZQ/exec';
    let allPlayers = [], tournamentRounds = [], currentTourneyRoundIdx = 0;

    async function loadPlayers() {
        try {
            const resp = await fetch(SCRIPT_URL);
            allPlayers = await resp.json();
            const roster = document.getElementById('tournament-roster');
            roster.innerHTML = allPlayers.map((p, i) => 
                `<label style="display:block; margin-bottom:5px;"><input type="checkbox" class="tourney-player-check" value="${p[0]}"> ${p[0]}</label>`
            ).join('');
        } catch (e) { alert("Failed to load players"); }
    }

    function startNewTournament() {
        const selected = Array.from(document.querySelectorAll('.tourney-player-check:checked')).map(cb => cb.value);
        if (selected.length < 2) return alert("Select at least 2 players");
        
        tournamentRounds = []; currentTourneyRoundIdx = 0;
        // Simple mock scheduling logic
        tournamentRounds.push(selected.map((p, i, arr) => i % 2 === 0 ? { white: p, black: arr[i+1] || "BYE" } : null).filter(Boolean));
        
        document.getElementById('tourney-roster-section').style.display = 'none';
        document.getElementById('tourney-active-dashboard').style.display = 'block';
        displayRound(0);
    }

    function displayRound(idx) {
        currentTourneyRoundIdx = idx;
        const container = document.getElementById('active-pairings-list');
        container.innerHTML = tournamentRounds[idx].map(pair => 
            `<div style="background:#111; padding:10px; display:flex; justify-content:space-between;">
                <span>${pair.white} vs ${pair.black}</span>
            </div>`
        ).join('');
    }

    function changeRound(dir) {
        if (tournamentRounds[currentTourneyRoundIdx + dir]) displayRound(currentTourneyRoundIdx + dir);
    }

    window.onload = loadPlayers;
</script>
</body>
</html>
