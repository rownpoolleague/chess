<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TOURNAMENT ENGINE</title>
    <style>
        :root { 
            --bg: #000; 
            --card: #111; 
            --accent: #3b82f6; 
            --text: #eee; 
            --go: #22c55e; 
        }
        * {
            box-sizing: border-box;
        }
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%;
            background-color: #111; 
            overflow: hidden; /* Prevents bounce scrolling on full screen mobile apps */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .form-wrapper {
            width: 100%; 
            height: 100dvh; 
            border: 4px solid #1e90ff;
            border-radius: 0; 
            display: flex;
            flex-direction: column;
            
            /* Accounts for physical notches and home bar overlays in true fullscreen mode */
            padding-top: env(safe-area-inset-top, 2px);
            padding-bottom: env(safe-area-inset-bottom, 2px);
            padding-left: env(safe-area-inset-left, 2px);
            padding-right: env(safe-area-inset-right, 2px);
        }
        .engine-box { 
            flex: 1;
            background: var(--bg); 
            padding: 15px; 
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Standard scrolling inside the blue frame boundaries if roster/standings grow */
        }
        select, input, .action-btn { 
            width: 100%; 
            box-sizing: border-box; 
            padding: 12px; 
            margin-bottom: 10px; 
            border-radius: 4px; 
            border: 1px solid #333; 
            background: #181818; 
            color: white; 
            font-size: 16px; /* Prevents iOS browser zoom on input focus */
        }
        .action-btn { 
            background: var(--go); 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .p-label { 
            display: flex; 
            align-items: center; 
            padding: 10px 0; 
            border-bottom: 1px solid #222; 
            cursor: pointer; 
            color: var(--text);
        }
        .p-label input { 
            width: auto; 
            margin: 0 10px 0 0; 
        }
        .match-card { 
            background: #1a1a1a; 
            padding: 15px; 
            margin-bottom: 10px; 
            border-radius: 4px; 
            border-left: 4px solid #333; 
            color: var(--text);
        }
        .res-btn { 
            flex: 1; 
            padding: 8px; 
            background: #222; 
            border: 1px solid #444; 
            color: white; 
            cursor: pointer; 
        }
        .res-btn.active { 
            background: var(--accent); 
        }
        .standings { 
            margin-top: 20px; 
            border-top: 1px solid #333; 
            padding-top: 10px; 
            font-size: 0.9rem; 
            color: var(--text);
        }
    </style>
</head>
<body>

<div class="form-wrapper">
    <div class="engine-box">
        <div id="setup-view">
            <select id="fmt" onchange="toggleRounds()">
                <option value="swiss">Swiss</option>
                <option value="rr">Round Robin</option>
            </select>
            <input type="number" id="rnd-count" placeholder="Number of Rounds">
            <div id="roster-list" style="max-height: 73vh; overflow-y: auto; background: #000; padding: 10px; border-radius: 4px;"></div>
            <button class="action-btn" style="margin-top: 10px;" onclick="startTournament()">BEGIN</button>
        </div>

        <div id="active-view" style="display: none;">
            <div id="round-title" style="font-weight: bold; margin-bottom: 10px; color: var(--text);"></div>
            <div id="pairings-list"></div>
            <button id="next-btn" class="action-btn" style="display: none;" onclick="processRound()">NEXT ROUND</button>
            <button id="dl-btn" class="action-btn" style="display: none; background: #3b82f6;" onclick="downloadResults()">DOWNLOAD RESULTS</button>
            <button id="reset-btn" class="action-btn" style="display: none; background: #ef4444;" onclick="location.reload()">RESET ENGINE</button>
            <div class="standings">
                <div style="font-weight:bold; margin-bottom: 5px;">STANDINGS</div>
                <div id="standings-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwICYY6WRDzPPXbO70Fxa9eGz4qWREHX7pEXGozNR_QYfeHHBFDciPGy2Cwhbpq7AUQZQ/exec';
    let players = [], pairings = [], currentRound = 1, totalRounds = 0, format = '', history = [];

    async function load() {
        const data = await (await fetch(SCRIPT_URL)).json();
        players = data.map(p => ({ name: p[0], score: 0 }));
        document.getElementById('roster-list').innerHTML = players.map(p => 
            `<label class="p-label"><input type="checkbox" class="p-select" value="${p.name}"> ${p.name}</label>`).join('');
    }

    function toggleRounds() { document.getElementById('rnd-count').style.display = document.getElementById('fmt').value === 'rr' ? 'none' : 'block'; }

    function startTournament() {
        const selected = Array.from(document.querySelectorAll('.p-select:checked')).map(cb => cb.value);
        if(selected.length < 2) return alert("Select at least 2 players");
        format = document.getElementById('fmt').value;
        players = players.filter(p => selected.includes(p.name));
        totalRounds = format === 'rr' ? players.length - 1 : parseInt(document.getElementById('rnd-count').value) || 3;
        pairings = generatePairings();
        document.getElementById('setup-view').style.display = 'none';
        document.getElementById('active-view').style.display = 'block';
        render();
    }

    function generatePairings() {
        let sorted = [...players].sort((a, b) => b.score - a.score);
        let p = [];
        for(let i=0; i<sorted.length; i+=2) p.push({ w: sorted[i], b: sorted[i+1] || {name: "BYE"}, res: null });
        return p;
    }

    function formatScore(score) {
        if (score === 0) return "0";
        if (score % 1 === 0) return score.toString();
        let whole = Math.floor(score);
        return whole > 0 ? `${whole} 1/2` : "1/2";
    }

    function render() {
        document.getElementById('round-title').innerText = `Round ${currentRound} of ${totalRounds}`;
        document.getElementById('pairings-list').innerHTML = pairings.map((m, i) => `
            <div class="match-card">
                <div><strong>${m.w.name}</strong> vs <strong>${m.b.name}</strong></div>
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <button class="res-btn ${m.res === 'w' ? 'active' : ''}" onclick="setRes(${i}, 'w')">1 - 0</button>
                    <button class="res-btn ${m.res === 'd' ? 'active' : ''}" onclick="setRes(${i}, 'd')">1/2 - 1/2</button>
                    <button class="res-btn ${m.res === 'b' ? 'active' : ''}" onclick="setRes(${i}, 'b')">0 - 1</button>
                </div>
            </div>`).join('');
        
        document.getElementById('standings-list').innerHTML = [...players].sort((a,b) => b.score - a.score).map(p => `
            <div style="display:flex; justify-content:space-between; padding:4px 0;">
                <span>${p.name}</span>
                <span>${formatScore(p.score)}</span>
            </div>`).join('');
            
        document.getElementById('next-btn').style.display = pairings.every(m => m.res !== null) ? 'block' : 'none';
    }

    function setRes(i, res) { pairings[i].res = res; render(); }

    function processRound() {
        history.push({ round: currentRound, matches: JSON.parse(JSON.stringify(pairings)) });
        pairings.forEach(m => {
            if(m.res === 'w') m.w.score += 1;
            else if(m.res === 'd') { m.w.score += 0.5; m.b.score += 0.5; }
            else if(m.res === 'b') m.b.score += 1;
        });
        if(currentRound >= totalRounds) {
            document.getElementById('round-title').innerText = "Tournament Complete";
            document.getElementById('pairings-list').innerHTML = "";
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('dl-btn').style.display = 'block';
            document.getElementById('reset-btn').style.display = 'block';
            render();
        } else {
            currentRound++;
            pairings = generatePairings();
            render();
        }
    }

    function downloadResults() {
        let content = "ROUND RESULTS\n\n";
        history.forEach(r => {
            content += `ROUND ${r.round}\n`;
            r.matches.forEach(m => content += `${m.w.name} vs ${m.b.name} - Result: ${m.res}\n`);
            content += "\n";
        });
        content += "FINAL STANDINGS\n" + [...players].sort((a,b) => b.score - a.score).map(p => `${p.name}: ${formatScore(p.score)}`).join("\n");
        
        const blob = new Blob([content], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'tournament_results.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    window.onload = load;
</script>
</body>
</html>
