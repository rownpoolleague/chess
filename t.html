<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament Results</title>

<style>
    body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    h1 {
        text-align: center;
        font-size: 28px;
        margin-bottom: 20px;
        color: #fff;
    }

    .tournament {
        background: #1c1c1c;
        padding: 15px;
        margin-bottom: 12px;
        border-radius: 8px;
        cursor: pointer;
        border-left: 5px solid #4caf50;
    }

    .tournament:hover {
        background: #222;
    }

    #modal {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        display: none;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    #modalContent {
        background: #1c1c1c;
        padding: 20px;
        border-radius: 10px;
        max-height: 90%;
        overflow-y: auto;
        width: 100%;
        max-width: 600px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    th, td {
        border: 1px solid #333;
        padding: 8px;
        text-align: left;
    }

    th {
        background: #222;
        font-weight: bold;
    }

    #closeBtn {
        background: #e53935;
        padding: 10px 15px;
        border-radius: 6px;
        cursor: pointer;
        float: right;
        margin-bottom: 10px;
    }
</style>
</head>

<body>

<h1>Tournament Results</h1>
<div id="list"></div>

<div id="modal">
    <div id="modalContent">
        <div id="closeBtn">Close</div>
        <h2 id="modalTitle"></h2>
        <div id="modalTable"></div>
    </div>
</div>

<script>
const FILE_ID = "1fjRWL89XIfXi0yIdzPKXdBH_80dzFqcVdQp2VFLKY0M";
const HTML_URL = `https://docs.google.com/spreadsheets/d/${FILE_ID}/edit`;

// STEP 1 — SCRAPE SHEET LIST FROM HTML
fetch(HTML_URL)
    .then(r => r.text())
    .then(html => {
        // Extract sheet objects: {"id":123,"title":"Sheet Name"}
        const matches = [...html.matchAll(/{"id":(\d+),"title":"(.*?)"}/g)];

        matches.forEach(m => {
            const gid = m[1];
            const title = m[2];

            // Filter: title contains a date like 3/14/25
            if (!title.match(/\d{1,2}\/\d{1,2}\/\d{2,4}/)) return;

            addTournament(title, gid);
        });
    });

// STEP 2 — ADD TOURNAMENT ENTRY
function addTournament(title, gid) {
    const list = document.getElementById("list");

    const div = document.createElement("div");
    div.className = "tournament";
    div.textContent = title; // <-- SHEET TAB NAME AS CLICKABLE NAME

    div.onclick = () => loadTournament(title, gid);

    list.appendChild(div);
}

// STEP 3 — LOAD CSV FOR ONE TOURNAMENT
function loadTournament(title, gid) {
    const url = `https://docs.google.com/spreadsheets/d/${FILE_ID}/export?format=csv&gid=${gid}`;

    fetch(url)
        .then(r => r.text())
        .then(text => {
            const rows = text.split("\n").map(r => r.split(",").map(x => x.trim()));
            openModal(title, rows);
        });
}

// STEP 4 — BUILD MODAL TABLE
function openModal(title, rows) {
    document.getElementById("modalTitle").textContent = title;

    let html = "<table><tr>";
    rows[0].forEach(h => html += `<th>${h}</th>`);
    html += "</tr>";

    for (let i = 1; i < rows.length; i++) {
        if (!rows[i].some(x => x)) continue;

        let row = [...rows[i]];

        // Merge split name columns
        if (row.length >= 3 && row[1] && row[2]) {
            if (!row[1].includes(",") && row[2]) {
                row[1] = row[1] + ", " + row[2];
                row.splice(2, 1);
            }
        }

        // Remove quotes
        if (row[1]) row[1] = row[1].replace(/"/g, "");

        html += "<tr>";
        row.forEach(cell => html += `<td>${cell}</td>`);
        html += "</tr>";
    }

    html += "</table>";

    document.getElementById("modalTable").innerHTML = html;
    document.getElementById("modal").style.display = "flex";
}

document.getElementById("closeBtn").onclick = () => {
    document.getElementById("modal").style.display = "none";
};
</script>

</body>
</html>
