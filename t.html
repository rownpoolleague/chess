<!DOCTYPE html>
<html>
<head>
    <script src="asfa.js"></script>
    <meta charset="UTF-8">
    <title>Tournament Viewer</title>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .round {
            background: #1c1c1c;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .round h2 {
            margin-top: 0;
            color: #4fc3f7;
        }

        .pairing {
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }

        .pairing:last-child {
            border-bottom: none;
        }

        .scores {
            margin-top: 10px;
            padding: 10px;
            background: #222;
            border-radius: 6px;
        }

        .score-row {
            padding: 4px 0;
            border-bottom: 1px solid #333;
        }

        .score-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

<h1>Tournament Viewer</h1>

<div id="content">Loading…</div>

<script>


async function loadTournamentData() {
    try {
        const resp = await fetch(APP_CONFIG.APPSCRIPT_URL + "?action=tournament");
        const data = await resp.json();

        const rows = data.rounds;

        // ⭐ Only show the last row
        const last = rows[rows.length - 1];

        const rounds = [{
            round: last.round,
            pairings: JSON.parse(last.white),
            scores: JSON.parse(last.black)
        }];

        renderTournament(rounds);

    } catch (err) {
        document.getElementById("content").innerHTML = "Failed to load tournament data.";
        console.error(err);
    }
}


function renderTournament(rounds) {
    const container = document.getElementById("content");
    container.innerHTML = "";

    rounds.forEach(r => {
        const div = document.createElement("div");
        div.className = "round";

        div.innerHTML = `<h2>Round ${r.round}</h2>`;

        // Pairings
        r.pairings.forEach(p => {
            div.innerHTML += `
                <div class="pairing">
                    <strong>${p.white}</strong> vs <strong>${p.black}</strong>
                    <br>Result: ${p.result === null ? "—" : p.result}
                </div>
            `;
        });

        // Scores
        div.innerHTML += `<div class="scores"><strong>Scores:</strong></div>`;
        const scoreBox = div.querySelector(".scores");

        r.scores.forEach(s => {
            scoreBox.innerHTML += `
                <div class="score-row">
                    ${s.name}: ${s.score}
                </div>
            `;
        });

        container.appendChild(div);
    });
}

loadTournamentData();
</script>

</body>
</html>
