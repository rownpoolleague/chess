<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lean PGN Analyzer</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: sans-serif; background: #111; color: #eee; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; width: 100%; max-width: 1100px; }
        
        /* Board section */
        .board-section { flex: 1; min-width: 350px; }
        #board { width: 100%; }
        
        /* Game List section */
        .list-section { flex: 1; min-width: 300px; background: #222; height: 600px; overflow-y: auto; padding: 10px; border-radius: 4px; }
        .game-item { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; transition: 0.2s; }
        .game-item:hover { background: #2a2a2a; }
        .game-item.active { border-left: 4px solid #4CAF50; background: #333; }

        /* Controls & Data */
        .controls { margin: 15px 0; display: flex; gap: 10px; justify-content: center; }
        button { background: #444; color: white; border: none; padding: 12px 24px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        button:hover { background: #555; }
        .data-panel { background: #222; padding: 15px; margin-top: 15px; border-radius: 4px; font-size: 0.9em; }
        
        #file-input { margin-bottom: 20px; padding: 10px; background: #333; border: 1px dashed #555; width: 100%; max-width: 400px; }
    </style>
</head>
<body>

    <input type="file" id="file-input" accept=".pgn,.txt">

    <div class="container">
        <div class="board-section">
            <div id="board"></div>
            <div class="controls">
                <button onclick="moveStart()">|&lt;</button>
                <button onclick="moveBack()">&lt;</button>
                <button onclick="moveForward()">&gt;</button>
                <button onclick="moveEnd()">&gt;|</button>
            </div>
            <div id="game-info" class="data-panel">
                <strong>No Game Selected</strong><br>
                Upload your ROPL or Chess.com file to begin.
            </div>
        </div>

        <div class="list-section" id="game-list">
            <div style="text-align: center; color: #777; margin-top: 20px;">Games will appear here...</div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        // Use Wikipedia pieces for clear recognition
        const boardConfig = {
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        
        let board = Chessboard('board', boardConfig);
        let game = new Chess();
        let moveHistory = [];
        let index = -1;
        let pgnArray = [];

        document.getElementById('file-input').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                // Split PGNs accurately
                pgnArray = content.split(/\[Event /).filter(s => s.trim() !== "").map(s => "[Event " + s);
                renderList();
            };
            reader.readAsText(e.target.files[0]);
        });

        function renderList() {
            const list = document.getElementById('game-list');
            list.innerHTML = '';
            pgnArray.forEach((pgn, i) => {
                const g = new Chess();
                g.load_pgn(pgn);
                const h = g.header();
                const div = document.createElement('div');
                div.className = 'game-item';
                div.innerHTML = `<strong>${h.White} vs ${h.Black}</strong><br><small>${h.Date} | ${h.Result}</small>`;
                div.onclick = () => {
                    document.querySelectorAll('.game-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    loadGame(pgn);
                };
                list.appendChild(div);
            });
        }

        function loadGame(pgn) {
            game.load_pgn(pgn);
            moveHistory = game.history();
            const h = game.header();
            game.reset();
            index = -1;
            board.position('start');
            
            document.getElementById('game-info').innerHTML = `
                <strong>${h.White} vs ${h.Black}</strong> (${h.Result})<br>
                <em>${h.Opening || 'Theory analysis pending...'}</em><br>
                Termination: ${h.Termination}
            `;
        }

        function moveForward() {
            if (index < moveHistory.length - 1) {
                index++;
                game.move(moveHistory[index]);
                board.position(game.fen());
            }
        }

        function moveBack() {
            if (index >= 0) {
                game.undo();
                index--;
                board.position(game.fen());
            }
        }

        function moveStart() { game.reset(); index = -1; board.position('start'); }
        function moveEnd() { while(index < moveHistory.length-1) moveForward(); }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') moveForward();
            if (e.key === 'ArrowLeft') moveBack();
        });
        
        window.onresize = board.resize;
    </script>
</body>
</html>
