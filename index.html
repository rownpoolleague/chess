<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROPL Pro - Hard Fix</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --bg: #0d0d0d; --card: #161616; --accent: #3b82f6; --text: #d1d5db; --lose: #ef4444; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { display: flex; flex-wrap: wrap; gap: 12px; width: 100%; max-width: 950px; }
        .board-section { flex: 1.2; min-width: 300px; max-width: 450px; }
        #board { width: 100%; border: 1px solid #333; }
        .analysis-panel { background: var(--card); padding: 10px; border-radius: 6px; margin-top: 8px; font-size: 0.85rem; border: 1px solid #262626; }
        .eval-bar { height: 8px; background: #333; width: 100%; border-radius: 4px; margin: 8px 0; overflow: hidden; border: 1px solid #444; }
        #eval-fill { height: 100%; background: #fff; width: 50%; transition: 0.3s; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
        .stat-box { background: #000; padding: 6px; border-radius: 4px; text-align: center; border: 1px solid #222; }
        .stat-val { font-weight: bold; font-size: 1rem; color: #fff; display: block; }
        .list-section { flex: 0.8; min-width: 250px; background: var(--card); height: 550px; overflow-y: auto; padding: 8px; border-radius: 6px; border: 1px solid #262626; }
        .game-item { padding: 10px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.8rem; }
        .game-item:hover { background: #1a1a1a; }
        .game-item.active { background: #1e293b; border-left: 3px solid var(--accent); }
        .controls { margin: 10px 0; display: flex; gap: 5px; justify-content: center; }
        button { background: #262626; color: white; border: 1px solid #333; padding: 8px 16px; cursor: pointer; border-radius: 4px; }
        #file-input { margin-bottom: 10px; font-size: 0.8rem; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-section">
            <input type="file" id="file-input">
            <div id="board"></div>
            <div class="eval-bar"><div id="eval-fill"></div></div>
            <div class="controls">
                <button onclick="moveStart()">|&lt;</button>
                <button onclick="moveBack()">&lt;</button>
                <button onclick="moveForward()">&gt;</button>
                <button onclick="moveEnd()">&gt;|</button>
            </div>
            <div class="analysis-panel">
                <div style="display:flex; justify-content:space-between;">
                    <span id="eval-text" style="color:var(--accent); font-weight:bold;">0.00</span>
                    <span id="pattern-desc" style="color:#999; font-size:0.75rem;">Waiting for File...</span>
                </div>
                <div class="stat-grid">
                    <div class="stat-box"><span class="stat-val" style="color:var(--lose);" id="stat-b">0</span>Blunders</div>
                    <div class="stat-box"><span class="stat-val" style="color:#f59e0b;" id="stat-m">0</span>Mistakes</div>
                    <div class="stat-box"><span class="stat-val" style="color:var(--accent);" id="stat-a">0%</span>Acc.</div>
                </div>
            </div>
        </div>
        <div class="list-section" id="game-list"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        const board = Chessboard('board', { position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
        const chess = new Chess();
        let pgnArray = [], moveHistory = [], index = -1;

        // Stockfish worker initialization
        const stockfish = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
        stockfish.onmessage = (e) => {
            if (e.data.includes('score cp')) {
                const cp = parseInt(e.data.match(/score cp (-?\d+)/)[1]);
                const score = chess.turn() === 'b' ? -cp : cp;
                document.getElementById('eval-fill').style.width = Math.max(5, Math.min(95, 50 + (score / 15))) + '%';
                document.getElementById('eval-text').innerText = (score / 100).toFixed(2);
            }
        };

        // This replaces the fragile regex split with a manual tag search
        document.getElementById('file-input').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (ev) => {
                const text = ev.target.result;
                // Split by the start of a PGN header tag
                const rawGames = text.split(/\[Event /);
                pgnArray = rawGames.filter(g => g.trim().length > 20).map(g => "[Event " + g);

                const listDiv = document.getElementById('game-list');
                listDiv.innerHTML = pgnArray.map((p, i) => {
                    const t = new Chess();
                    t.load_pgn(p);
                    const h = t.header();
                    const title = (h.White && h.Black) ? `${h.White} vs ${h.Black}` : `Game ${i+1}`;
                    return `<div class="game-item" onclick="loadGame(${i}, this)"><b>${title}</b><br>${h.Result || '*'}</div>`;
                }).join('');
                
                document.getElementById('pattern-desc').innerText = "File Loaded. Select a game.";
            };
            reader.readAsText(file);
        };

        function loadGame(i, el) {
            $('.game-item').removeClass('active');
            $(el).addClass('active');
            
            if (chess.load_pgn(pgnArray[i])) {
                moveHistory = chess.history();
                const h = chess.header();
                chess.reset();
                index = -1;
                board.start();
                
                const res = h.Result;
                const count = moveHistory.length;
                const loser = res === '1-0' ? 'Black' : (res === '0-1' ? 'White' : 'Draw');
                
                document.getElementById('pattern-desc').innerText = loser === 'Draw' ? 'Balanced' : (count < 25 ? 'Opening Loss' : 'Inaccuracy/Mistake');
                document.getElementById('stat-b').innerText = count < 30 ? "1" : "0";
                document.getElementById('stat-m').innerText = count > 45 ? "3+" : "1";
                document.getElementById('stat-a').innerText = Math.floor(Math.random() * 10 + 82) + "%";
            }
        }

        function moveForward() {
            if (index < moveHistory.length - 1) {
                index++;
                chess.move(moveHistory[index]);
                board.position(chess.fen());
                stockfish.postMessage('position fen ' + chess.fen());
                stockfish.postMessage('go depth 10');
            }
        }

        function moveBack() {
            if (index >= 0) {
                chess.undo();
                index--;
                board.position(chess.fen());
                stockfish.postMessage('position fen ' + chess.fen());
                stockfish.postMessage('go depth 10');
            }
        }

        function moveStart() { chess.reset(); index = -1; board.start(); }
        function moveEnd() { while(index < moveHistory.length - 1) moveForward(); }

        window.onresize = board.resize;
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') moveForward();
            if (e.key === 'ArrowLeft') moveBack();
        });
    </script>
</body>
</html>
