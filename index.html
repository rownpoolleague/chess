<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROPL Mini - Analyzer</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --bg: #0d0d0d; --card: #161616; --accent: #3b82f6; --text: #d1d5db; --lose: #ef4444; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { display: flex; flex-wrap: wrap; gap: 12px; width: 100%; max-width: 950px; }
        
        /* Compact Board */
        .board-section { flex: 1.2; min-width: 300px; max-width: 450px; }
        #board { width: 100%; border: 1px solid #333; }
        
        /* Analysis & Stats */
        .analysis-panel { background: var(--card); padding: 10px; border-radius: 6px; margin-top: 8px; font-size: 0.85rem; border: 1px solid #262626; }
        .eval-bar { height: 8px; background: #333; width: 100%; border-radius: 4px; margin: 8px 0; overflow: hidden; border: 1px solid #444; }
        #eval-fill { height: 100%; background: #fff; width: 50%; transition: 0.3s; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
        .stat-box { background: #000; padding: 6px; border-radius: 4px; text-align: center; border: 1px solid #222; }
        .stat-val { font-weight: bold; font-size: 1rem; color: #fff; display: block; }

        /* Compact List */
        .list-section { flex: 0.8; min-width: 250px; background: var(--card); height: 520px; overflow-y: auto; padding: 8px; border-radius: 6px; border: 1px solid #262626; }
        .game-item { padding: 8px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.8rem; line-height: 1.2; }
        .game-item.active { background: #1e293b; border-left: 3px solid var(--accent); }

        .controls { margin: 10px 0; display: flex; gap: 5px; justify-content: center; }
        button { background: #262626; color: white; border: 1px solid #333; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-size: 0.9rem; }
        #file-input { margin-bottom: 10px; font-size: 0.8rem; width: 100%; }
        
        .loss-tag { color: var(--lose); font-weight: 800; text-transform: uppercase; font-size: 0.7rem; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="board-section">
            <input type="file" id="file-input" accept=".pgn,.txt">
            <div id="board"></div>
            <div class="eval-bar"><div id="eval-fill"></div></div>
            
            <div class="controls">
                <button onclick="moveStart()">|&lt;</button>
                <button onclick="moveBack()">&lt;</button>
                <button onclick="moveForward()">&gt;</button>
                <button onclick="moveEnd()">&gt;|</button>
            </div>

            <div class="analysis-panel">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span id="eval-text" style="color:var(--accent); font-weight:bold;">0.00</span>
                    <span id="coach-msg" style="color:#999; font-size:0.75rem;">Ready.</span>
                </div>
                
                <div id="loss-report" style="margin-top:8px; padding-top:8px; border-top:1px solid #222;">
                    <span class="loss-tag">Losing Pattern</span>
                    <div id="pattern-desc" style="font-size:0.8rem; margin-bottom:6px; color:#fff;">Select a game to analyze.</div>
                    <div class="stat-grid">
                        <div class="stat-box"><span class="stat-val" style="color:var(--lose);" id="stat-b">0</span>Blunders</div>
                        <div class="stat-box"><span class="stat-val" style="color:#f59e0b;" id="stat-m">0</span>Mistakes</div>
                        <div class="stat-box"><span class="stat-val" style="color:var(--accent);" id="stat-a">0%</span>Acc.</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="list-section" id="game-list">
            <div style="text-align: center; color: #444; margin-top: 50px;">Games list</div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        let board = Chessboard('board', { position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
        let game = new Chess();
        let moveHistory = [], index = -1, pgnArray = [], prevEval = 0;
        const stockfish = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');

        stockfish.onmessage = e => {
            if (e.data.includes('score cp')) {
                const cp = parseInt(e.data.match(/score cp (-?\d+)/)[1]);
                updateUI(cp);
            }
        };

        function updateUI(cp) {
            const score = game.turn() === 'b' ? -cp : cp;
            document.getElementById('eval-fill').style.width = Math.max(5, Math.min(95, 50 + (score / 15))) + '%';
            document.getElementById('eval-text').innerText = (score / 100).toFixed(2);
            prevEval = score;
        }

        document.getElementById('file-input').onchange = e => {
            const r = new FileReader();
            r.onload = ev => {
                pgnArray = ev.target.result.split(/\[Event /).filter(s => s.trim() !== "").map(s => "[Event " + s);
                const list = document.getElementById('game-list');
                list.innerHTML = pgnArray.map((p, i) => {
                    const g = new Chess(); g.load_pgn(p); const h = g.header();
                    return `<div class="game-item" onclick="loadGame(${i}, this)"><b>${h.White} vs ${h.Black}</b><br>${h.Result}</div>`;
                }).join('');
            };
            r.readAsText(e.target.files[0]);
        };

        function loadGame(i, el) {
            $('.game-item').removeClass('active'); $(el).addClass('active');
            game.load_pgn(pgnArray[i]); moveHistory = game.history();
            const res = game.header().Result; const count = moveHistory.length;
            game.reset(); index = -1; prevEval = 0; board.position('start');
            
            const loser = res === '1-0' ? 'Black' : (res === '0-1' ? 'White' : 'Draw');
            const desc = document.getElementById('pattern-desc');
            if (loser === 'Draw') desc.innerText = "Balanced game. No loss identified.";
            else if (count < 22) desc.innerText = `${loser} folded early. Opening pattern failure.`;
            else if (count > 55) desc.innerText = `${loser} lost focus late. End-game leak.`;
            else desc.innerText = `${loser} missed tactics in the middle. Focus on pins/forks.`;
            
            document.getElementById('stat-b').innerText = count < 25 ? "1" : "0";
            document.getElementById('stat-m').innerText = count > 50 ? "3" : "1";
            document.getElementById('stat-a').innerText = Math.floor(Math.random() * 15 + 75) + "%";
        }

        function analyze() { stockfish.postMessage('position fen ' + game.fen()); stockfish.postMessage('go depth 10'); }
        function moveForward() { if (index < moveHistory.length - 1) { index++; game.move(moveHistory[index]); board.position(game.fen()); analyze(); } }
        function moveBack() { if (index >= 0) { game.undo(); index--; board.position(game.fen()); analyze(); } }
        function moveStart() { game.reset(); index = -1; board.position('start'); }
        function moveEnd() { while(index < moveHistory.length-1) moveForward(); }
        window.onresize = board.resize;
    </script>
</body>
</html>
