<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Main Menu</title>
    <link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<!-- Standard favicon for browser tabs -->
<link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/rownpoolleague/scores/main/zzzz.png">
<!-- iOS Home Screen icon -->
<link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/rownpoolleague/scores/main/zzzz.png">
<!-- Android / Chrome Home Screen icon -->
<link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/rownpoolleague/scores/main/xxxx.png">
<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: #111;
    /* Removed: display: flex; flex-direction: column; min-height: 100vh; */
}
.overlay {
    /* Removed: flex: 1; */
    padding: 20px 10px;
    box-sizing: border-box;
}
h1 {
    text-align: center;
    color: white;
    margin-bottom: 20px;
    font-size: 32px;
}
.menu-container {
    max-width: 500px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.menu-button {
    display: block;
    margin-left: auto;
    margin-right: auto;   /* centers horizontally with zero vertical spacing */
    text-align: center;
    padding: 4px;
    background: #1e90ff;
    color: white;
    text-decoration: none;
    font-size: 24px;
    border-radius: 8px;
    font-weight: bold;
    height: 28px;
    width: 250px;
}
/* Footer styling for logo */
footer {
    text-align: center;
    padding: 20px;
}
.footer-logo {
    max-width: 200px;
    height: auto;
}
.form-wrapper {
    width: 100%; 
    /* Ensures the wrapper hits the bottom regardless of browser or app mode */
    min-height: 100dvh; 
    
    /* Accounts for the iPhone "Home Bar" and bottom notches in app mode */
    padding: 2px 2px env(safe-area-inset-bottom) 2px;
    
    border: 4px solid #1e90ff;
    border-radius: 0; 
    box-sizing: border-box; 
    
    /* Optional: Keeps content aligned if the form is shorter than the screen */
    display: flex;
    flex-direction: column;
}

</style>
</head>
<body>
    <div class="form-wrapper">
<div class="overlay">
    <h1>Main Menu</h1>
    <div class="menu-container">
        <a class="menu-button" href="members.html">SSCC Members</a>
        <a class="menu-button" href="Tournament.html">Run Tournament</a>
        <a class="menu-button" href="Clock.html">Clock</a>
        <a class="menu-button" href="submit.html">Submit a Match</a>
        

        
    </div>
</div>
<!-- Added Logo -->
<footer>
    <img src="icon.png" alt="Club Logo" class="footer-logo">
</footer>
    </div>
</body>
</html>
