<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGN Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: sans-serif; background: #111; color: #eee; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { width: 95%; max-width: 1000px; padding: 10px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        #board { width: 400px; max-width: 100vw; }
        .controls { margin-top: 10px; display: flex; gap: 5px; }
        button { padding: 10px 20px; cursor: pointer; background: #333; color: white; border: 1px solid #444; border-radius: 4px; }
        button:hover { background: #444; }
        .game-list-container { flex: 1; min-width: 300px; max-height: 500px; overflow-y: auto; background: #222; padding: 10px; border-radius: 4px; }
        .game-item { padding: 8px; border-bottom: 1px solid #333; cursor: pointer; font-size: 0.9em; }
        .game-item:hover { background: #333; }
        #file-input { margin: 20px; color: #ccc; }
        .info { margin-top: 10px; background: #222; padding: 10px; width: 100%; border-radius: 4px; font-size: 0.85em; line-height: 1.4; }
    </style>
</head>
<body>

    <input type="file" id="file-input" accept=".pgn,.txt">

    <div class="container">
        <div>
            <div id="board"></div>
            <div class="controls">
                <button onclick="moveStart()">|&lt;</button>
                <button onclick="moveBack()">&lt;</button>
                <button onclick="moveForward()">&gt;</button>
                <button onclick="moveEnd()">&gt;|</button>
            </div>
            <div id="game-info" class="info">Select a game to see details.</div>
        </div>

        <div class="game-list-container" id="game-list">
            <div style="text-align: center; color: #666;">Upload a file to list games</div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        let board = Chessboard('board', 'start');
        let game = new Chess();
        let history = [];
        let currentMoveIndex = -1;
        let allGames = [];

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                // Split by [Event tag but keep the tag
                allGames = content.split(/(\[Event\s)/g).reduce((acc, curr, i, arr) => {
                    if (curr === '[Event ') acc.push(curr + arr[i + 1]);
                    return acc;
                }, []);
                
                renderGameList();
            };
            reader.readAsText(file);
        });

        function renderGameList() {
            const list = document.getElementById('game-list');
            list.innerHTML = '';
            allGames.forEach((pgn, index) => {
                const tempGame = new Chess();
                tempGame.load_pgn(pgn);
                const header = tempGame.header();
                const item = document.createElement('div');
                item.className = 'game-item';
                item.innerHTML = `<strong>${header.White || 'Unknown'}</strong> vs <strong>${header.Black || 'Unknown'}</strong><br>
                                  <small>${header.Date || ''} • ${header.Result || ''}</small>`;
                item.onclick = () => loadGame(index);
                list.appendChild(item);
            });
        }

        function loadGame(index) {
            game.load_pgn(allGames[index]);
            history = game.history();
            const header = game.header();
            
            // Reset to start
            game.reset();
            currentMoveIndex = -1;
            board.position('start');
            
            // Display Info
            document.getElementById('game-info').innerHTML = `
                <strong>Event:</strong> ${header.Event || 'N/A'}<br>
                <strong>Opening:</strong> ${header.ECO || 'N/A'} ${header.Opening || ''}<br>
                <strong>Termination:</strong> ${header.Termination || 'N/A'}
            `;
        }

        function moveForward() {
            if (currentMoveIndex < history.length - 1) {
                currentMoveIndex++;
                game.move(history[currentMoveIndex]);
                board.position(game.fen());
            }
        }

        function moveBack() {
            if (currentMoveIndex >= 0) {
                game.undo();
                currentMoveIndex--;
                board.position(game.fen());
            }
        }

        function moveStart() {
            game.reset();
            currentMoveIndex = -1;
            board.position('start');
        }

        function moveEnd() {
            while (currentMoveIndex < history.length - 1) {
                moveForward();
            }
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') moveForward();
            if (e.key === 'ArrowLeft') moveBack();
        });
    </script>
</body>
</html>
