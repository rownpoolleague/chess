<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROPL Pro - AI Coach</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --bg: #111; --card: #222; --accent: #4CAF50; --error: #dc2626; --warning: #f59e0b; }
        body { font-family: sans-serif; background: var(--bg); color: #eee; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; width: 100%; max-width: 1200px; }
        
        /* Board section */
        .board-section { flex: 1.5; min-width: 350px; }
        #board { width: 100%; }
        
        /* Analysis Panel */
        .analysis-panel { background: #1a1a1a; padding: 15px; border-radius: 4px; margin-top: 10px; border-left: 4px solid var(--accent); }
        .eval-bar { height: 10px; background: #444; width: 100%; border-radius: 5px; margin: 10px 0; overflow: hidden; position: relative; }
        #eval-fill { height: 100%; background: #fff; width: 50%; transition: 0.3s; }
        
        /* List section */
        .list-section { flex: 1; min-width: 300px; background: var(--card); height: 650px; overflow-y: auto; padding: 10px; border-radius: 4px; }
        .game-item { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; }
        .game-item.active { border-left: 4px solid var(--accent); background: #333; }

        .coach-feedback { font-weight: bold; margin-top: 5px; }
        .blunder { color: var(--error); }
        .mistake { color: var(--warning); }
        .best { color: var(--accent); }

        .controls { margin: 15px 0; display: flex; gap: 10px; justify-content: center; }
        button { background: #444; color: white; border: none; padding: 12px 24px; cursor: pointer; border-radius: 4px; }
        #file-input { margin-bottom: 20px; padding: 10px; background: #333; border: 1px dashed #555; width: 100%; max-width: 400px; }
    </style>
</head>
<body>

    <input type="file" id="file-input" accept=".pgn,.txt">

    <div class="container">
        <div class="board-section">
            <div id="board"></div>
            <div class="eval-bar"><div id="eval-fill"></div></div>
            
            <div class="controls">
                <button onclick="moveStart()">|&lt;</button>
                <button onclick="moveBack()">&lt;</button>
                <button onclick="moveForward()">&gt;</button>
                <button onclick="moveEnd()">&gt;|</button>
            </div>

            <div id="coach-panel" class="analysis-panel">
                <div id="eval-text">AI Coach: Waiting for move...</div>
                <div id="coach-msg" class="coach-feedback"></div>
            </div>
        </div>

        <div class="list-section" id="game-list">
            <div style="text-align: center; color: #777; margin-top: 20px;">Upload PGN to start analysis...</div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        let board = Chessboard('board', { position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
        let game = new Chess();
        let moveHistory = [];
        let index = -1;
        let pgnArray = [];
        let prevEval = 0;

        // Initialize Stockfish Worker
        const stockfish = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
        
        stockfish.onmessage = function(event) {
            const line = event.data;
            if (line.includes('score cp')) {
                const cp = parseInt(line.match(/score cp (-?\d+)/)[1]);
                updateUI(cp);
            } else if (line.includes('score mate')) {
                const mate = parseInt(line.match(/score mate (-?\d+)/)[1]);
                updateUI(mate > 0 ? 1000 : -1000);
            }
        };

        function updateUI(cp) {
            // Perspective: if it's black's turn, Stockfish returns score from black's side
            const score = game.turn() === 'b' ? -cp : cp;
            const percentage = Math.max(0, Math.min(100, 50 + (score / 10)));
            document.getElementById('eval-fill').style.width = percentage + '%';
            document.getElementById('eval-text').innerText = `Evaluation: ${(score / 100).toFixed(2)}`;
            
            // Coaching Logic (Compare current eval to previous eval)
            const diff = score - prevEval;
            const msg = document.getElementById('coach-msg');
            
            if (game.turn() === 'w') { // Analysis for the move just made by Black
                 if (diff > 200) msg.innerHTML = '<span class="blunder">?? Blunder! You lost significant ground.</span>';
                 else if (diff > 100) msg.innerHTML = '<span class="mistake">? Mistake. There was a better line.</span>';
                 else if (diff < -50) msg.innerHTML = '<span class="best">Excellent Move.</span>';
                 else msg.innerText = "Solid play.";
            } else { // Analysis for move just made by White
                 if (diff < -200) msg.innerHTML = '<span class="blunder">?? Blunder! Massive drop in advantage.</span>';
                 else if (diff < -100) msg.innerHTML = '<span class="mistake">? Mistake. Precision is dropping.</span>';
                 else if (diff > 50) msg.innerHTML = '<span class="best">Strong Move.</span>';
                 else msg.innerText = "Book move or consistent.";
            }
            prevEval = score;
        }

        function analyzePosition() {
            stockfish.postMessage('position fen ' + game.fen());
            stockfish.postMessage('go depth 12');
        }

        document.getElementById('file-input').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                pgnArray = content.split(/\[Event /).filter(s => s.trim() !== "").map(s => "[Event " + s);
                renderList();
            };
            reader.readAsText(e.target.files[0]);
        });

        function renderList() {
            const list = document.getElementById('game-list');
            list.innerHTML = '';
            pgnArray.forEach((pgn, i) => {
                const g = new Chess();
                g.load_pgn(pgn);
                const h = g.header();
                const div = document.createElement('div');
                div.className = 'game-item';
                div.innerHTML = `<strong>${h.White} vs ${h.Black}</strong><br><small>${h.Result} | ${h.Date}</small>`;
                div.onclick = () => {
                    document.querySelectorAll('.game-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    loadGame(pgn);
                };
                list.appendChild(div);
            });
        }

        function loadGame(pgn) {
            game.load_pgn(pgn);
            moveHistory = game.history();
            game.reset();
            index = -1;
            prevEval = 0;
            board.position('start');
            document.getElementById('coach-msg').innerText = "Game loaded. Step forward to analyze.";
        }

        function moveForward() {
            if (index < moveHistory.length - 1) {
                index++;
                game.move(moveHistory[index]);
                board.position(game.fen());
                analyzePosition();
            }
        }

        function moveBack() {
            if (index >= 0) {
                game.undo();
                index--;
                board.position(game.fen());
                analyzePosition();
            }
        }

        function moveStart() { game.reset(); index = -1; prevEval = 0; board.position('start'); }
        function moveEnd() { while(index < moveHistory.length-1) moveForward(); }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') moveForward();
            if (e.key === 'ArrowLeft') moveBack();
        });
        
        window.onresize = board.resize;
    </script>
</body>
</html>
