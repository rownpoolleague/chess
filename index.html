<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon.png">

<title>SSCC MOBILE</title>

<style>
:root{
    --bg:#000;
    --card:#111;
    --accent:#3b82f6;
    --text:#eee;
    --go:#22c55e;
    --stop:#ef4444;
}

*{box-sizing:border-box;}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    margin:0;
    overflow:hidden;
    height:100vh;
    touch-action:manipulation;
}

header{
    background:var(--card);
    padding:10px;
    text-align:center;
    border-bottom:1px solid #222;
    height:45px;
}

h1{
    margin:0;
    font-size:1rem;
    color:var(--accent);
}

.view{
    display:none;
    padding:15px;
    height:calc(100vh - 105px);
    overflow-y:auto;
}

.view.active{
    display:block;
}

nav{
    position:fixed;
    bottom:0;
    width:100%;
    height:60px;
    background:#0a0a0a;
    display:flex;
    border-top:1px solid #222;
    z-index:100;
}

nav button{
    flex:1;
    background:none;
    border:none;
    color:#fff;
    font-size:0.7rem;
    font-weight:bold;
    text-transform:uppercase;
}

nav button.active{
    color:var(--accent);
}

#view-clock{
    padding:0;
    position:relative;
    overflow:hidden;
    height:calc(100vh - 105px);
}

#view-clock:fullscreen{
    height:100vh;
    width:100vw;
    background:#000;
}

#view-clock:fullscreen .clock-main{
    height:100vh;
}

.clock-top-settings{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    background:#000;
    padding:5px;
    border-bottom:1px solid #222;
    position:relative;
    z-index:10;
}

.clock-top-settings div{
    font-size:0.6rem;
    color:#888;
    text-align:center;
}

.clock-top-settings input{
    width:80%;
    background:#111;
    border:1px solid #333;
    color:#fff;
    text-align:center;
    font-size:0.8rem;
    padding:5px;
}

.clock-main{
    display:flex;
    flex-direction:column;
    height:100%;
    width:100%;
}

.clock-face{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#050505;
    border:1px solid #111;
    transition:background 0.05s;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    touch-action:manipulation;
}

.clock-face:active{
    background:#1a1a1a;
}

.time-stack{
    display:flex;
    flex-direction:column;
    align-items:center;
    transform:rotate(90deg);
    pointer-events:none;
}

.delay-display{
    font-size:1.8rem;
    color:var(--accent);
    font-weight:bold;
    height:2rem;
    visibility:hidden;
}

.delay-active{
    visibility:visible;
}

.main-time{
    font-size:6rem;
    font-family:monospace;
    color:#333;
    line-height:1;
    outline:none;
}

.clock-face.active{
    background:#111;
}

.clock-face.active .main-time{
    color:#fff;
}

.clock-face.timed-out{
    background:var(--stop)!important;
}

.clock-face.timed-out .main-time{
    color:#fff!important;
}

#clock-overlay{
    position:absolute;
    bottom:10px;
    right:5px;
    width:60px;
    display:flex;
    flex-direction:column;
    gap:8px;
    z-index:30;
}

.side-btn{
    height:70px;
    width:50px;
    border:none;
    color:white;
    font-weight:900;
    border-radius:8px;
    background:#333;
}

.side-btn span{
    display:block;
    transform:rotate(90deg);
    white-space:nowrap;
    font-size:0.9rem;
}

#pause-btn{
    background:var(--go);
}

.unlock-zone{
    position:absolute;
    top:0;
    bottom:0;
    right:0;
    width:60px;
    z-index:20;
}

.hidden-ui{
    display:none!important;
}

input,
select{
    width:100%;
    padding:12px;
    margin:8px 0;
    background:#181818;
    border:1px solid #333;
    color:white;
    border-radius:4px;
}

.action-btn{
    width:100%;
    padding:15px;
    background:var(--accent);
    border:none;
    color:white;
    font-weight:bold;
    border-radius:4px;
    margin-top:10px;
}

.player-row{
    background:#0a0a0a;
    padding:15px;
    border-bottom:1px solid #222;
}

.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    z-index:200;
    align-items:center;
    justify-content:center;
}

.modal-box{
    background:#111;
    border:1px solid #222;
    width:85%;
    max-width:320px;
    padding:20px;
    text-align:center;
    border-radius:6px;
}

.modal-btn{
    width:100%;
    padding:12px;
    background:var(--go);
    border:none;
    color:white;
    font-weight:bold;
    border-radius:4px;
}
</style>
</head>

<body>

<header>
<h1>SSCC MOBILE</h1>
</header>

<div id="confirmation-modal" class="modal-overlay">
    <div class="modal-box">
        <p>Match Submitted Successfully!</p>
        <button class="modal-btn" onclick="closeModal()">OK</button>
    </div>
</div>

<div id="view-players" class="view active">
    <div id="player-list-container"></div>
</div>

<div id="view-match" class="view">
    MATCH VIEW
</div>

<div id="view-clock" class="view">

    <div id="top-bar" class="clock-top-settings">
        <div>
            MINUTES<br>
            <input type="number" id="cfg-time" value="5">
        </div>

        <div>
            INCREMENT<br>
            <input type="number" id="cfg-inc" value="0">
        </div>

        <div>
            DELAY<br>
            <input type="number" id="cfg-delay" value="0">
        </div>
    </div>

    <div class="clock-main">

        <!-- BLACK -->
        <div id="black-timer" class="clock-face">
            <div class="time-stack">
                <div id="black-delay" class="delay-display">0</div>
                <div id="txt-black-time" class="main-time">05:00</div>
            </div>
        </div>

        <!-- WHITE -->
        <div id="white-timer" class="clock-face active">
            <div class="time-stack">
                <div id="white-delay" class="delay-display">0</div>
                <div id="txt-white-time" class="main-time">05:00</div>
            </div>
        </div>

    </div>

    <div id="unlock-trigger"
         class="unlock-zone"
         onmousedown="startHold()"
         onmouseup="endHold()"
         ontouchstart="startHold(event)"
         ontouchend="endHold()">
    </div>

    <div id="clock-overlay">
        <button id="reset-btn" class="side-btn" onclick="resetClock()">
            <span>RESET</span>
        </button>

        <button id="pause-btn" class="side-btn" onclick="armClock()">
            <span>START</span>
        </button>
    </div>

</div>

<div id="view-admin" class="view">
    ADMIN
</div>

<nav id="main-nav">
    <button onclick="showView('view-players')" class="nav-btn active">Players</button>
    <button onclick="showView('view-match')" class="nav-btn">Record</button>
    <button onclick="showView('view-clock')" class="nav-btn">Clock</button>
    <button onclick="showView('view-admin')" class="nav-btn">Admin</button>
</nav>

<script>

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

/* =========================
   ORIGINAL PLAYER SYSTEM
   ========================= */

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwI9YbFUJzr0dO6i_DsCAA_uyd76flIhQQh5pwXsRARaViVm2hv8ZPxfOOzzAmR-yhu/exec';

let allPlayers = [];

async function loadPlayers() {
    try {
        const resp = await fetch(SCRIPT_URL);
        allPlayers = await resp.json();
        renderList(allPlayers);
    } catch(e) {
        console.error(e);
    }
}

function renderList(list) {

    document.getElementById('player-list-container').innerHTML =
        list
        .filter(p => p && p[0] && p[0].trim() !== '')
        .map(p => {

            let stats = [];

            if (p[1]) stats.push(`Reg: ${p[1]}`);
            if (p[2]) stats.push(`Quick: ${p[2]}`);
            if (p[3]) stats.push(`Blitz: ${p[3]}`);

            return `
                <div class="player-row">
                    <div style="font-weight:bold;">${p[0]}</div>
                    ${stats.length ? `<div style="font-size:0.7rem;color:#888;">${stats.join(' | ')}</div>` : ''}
                </div>
            `;
        }).join('');
}

window.onload = loadPlayers;

/* =========================
   CLOCK SYSTEM
   ========================= */

let timers = {
    white: 300,
    black: 300
};

let active = null;
let ticker = null;
let delayLeft = 0;
let isArmed = false;
let holdTimer = null;

function showView(id) {

    document.querySelectorAll('.view').forEach(v => {
        v.classList.remove('active');
    });

    document.getElementById(id).classList.add('active');

    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('active');
    });

    const clicked = [...document.querySelectorAll('.nav-btn')]
        .find(btn => btn.getAttribute('onclick').includes(id));

    if (clicked) {
        clicked.classList.add('active');
    }
}

function armClock() {

    isArmed = true;
    active = null;

    const base =
        (parseInt(document.getElementById('cfg-time').value) || 5) * 60;

    timers.white = base;
    timers.black = base;

    updateClock();

    document.getElementById('clock-overlay').classList.add('hidden-ui');
    document.getElementById('top-bar').classList.add('hidden-ui');
    document.getElementById('main-nav').classList.add('hidden-ui');

    document.querySelectorAll('.clock-face').forEach(c => {
        c.classList.remove('timed-out');
    });

    const clockView = document.getElementById('view-clock');

    if (clockView.requestFullscreen) {
        clockView.requestFullscreen().catch(() => {});
    }
}

function switchClock(nextPlayer) {

    if (!isArmed) return;

    if (active && timers[active] <= 0) return;

    if (!ticker) {

        active = nextPlayer;

        delayLeft =
            parseInt(document.getElementById('cfg-delay').value) || 0;

        startTicker();

    } else {

        if (active && nextPlayer !== active) {

            timers[active] +=
                parseInt(document.getElementById('cfg-inc').value) || 0;

            document.getElementById(active + '-delay')
                .classList.remove('delay-active');
        }

        active = nextPlayer;

        delayLeft =
            parseInt(document.getElementById('cfg-delay').value) || 0;
    }

    document.querySelectorAll('.clock-face').forEach(c => {
        c.classList.remove('active');
    });

    document.getElementById(nextPlayer + '-timer')
        .classList.add('active');

    updateClock();
}

function startTicker() {

    if (ticker) return;

    ticker = setInterval(() => {

        if (!active) return;

        const delayEl =
            document.getElementById(active + '-delay');

        if (delayLeft > 0) {

            delayEl.innerText = delayLeft;
            delayEl.classList.add('delay-active');
            delayLeft--;

        } else {

            delayEl.classList.remove('delay-active');

            timers[active]--;

            updateClock();

            if (timers[active] <= 0) {

                clearInterval(ticker);
                ticker = null;

                document.getElementById(active + '-timer')
                    .classList.add('timed-out');
            }
        }

    }, 1000);
}

function updateClock() {

    ['white', 'black'].forEach(p => {

        const m = Math.floor(timers[p] / 60);
        const s = timers[p] % 60;

        document.getElementById(`txt-${p}-time`).innerText =
            `${m}:${s < 10 ? '0' + s : s}`;
    });
}

function resetClock() {

    clearInterval(ticker);

    ticker = null;
    active = null;
    isArmed = false;

    const base =
        (parseInt(document.getElementById('cfg-time').value) || 5) * 60;

    timers.white = base;
    timers.black = base;

    document.getElementById('clock-overlay').classList.remove('hidden-ui');
    document.getElementById('top-bar').classList.remove('hidden-ui');
    document.getElementById('main-nav').classList.remove('hidden-ui');

    document.querySelectorAll('.clock-face').forEach(c => {
        c.classList.remove('timed-out');
        c.classList.remove('active');
    });

    document.querySelectorAll('.delay-display').forEach(d => {
        d.classList.remove('delay-active');
        d.innerText = '0';
    });

    updateClock();

    if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
    }
}

function startHold(e) {

    if (e) e.preventDefault();

    if (!isArmed) return;

    holdTimer = setTimeout(() => {

        const overlay =
            document.getElementById('clock-overlay');

        if (!overlay.classList.contains('hidden-ui')) {

            overlay.classList.add('hidden-ui');

            document.getElementById('top-bar')
                .classList.add('hidden-ui');

            document.getElementById('main-nav')
                .classList.add('hidden-ui');

        } else {

            if (ticker) {
                clearInterval(ticker);
                ticker = null;
            }

            overlay.classList.remove('hidden-ui');

            document.getElementById('top-bar')
                .classList.remove('hidden-ui');

            document.getElementById('main-nav')
                .classList.remove('hidden-ui');
        }

    }, 1500);
}

function endHold() {
    clearTimeout(holdTimer);
}

/* =========================
   CLOCK FACE CLICK FIX
   ========================= */

const blackTimer = document.getElementById('black-timer');
const whiteTimer = document.getElementById('white-timer');

function bindClockPress(el, player){

    el.addEventListener('touchstart', function(e){

        e.preventDefault();
        e.stopPropagation();

        switchClock(player);

    }, { passive:false });

    el.addEventListener('mousedown', function(e){

        e.preventDefault();
        e.stopPropagation();

        switchClock(player);

    });
}

bindClockPress(blackTimer, 'white');
bindClockPress(whiteTimer, 'black');

updateClock();

</script>

</body>
</html>
