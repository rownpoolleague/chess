<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="icon.png">
    <title>SSCC MOBILE</title>
    <style>
        :root { --bg: #000; --card: #111; --accent: #3b82f6; --text: #eee; --go: #22c55e; --stop: #ef4444; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100vh; touch-action: manipulation; }
        
        header { background: var(--card); padding: 10px; text-align: center; border-bottom: 1px solid #222; height: 45px; box-sizing: border-box; }
        h1 { margin: 0; font-size: 1rem; color: var(--accent); }
        .view { display: none; padding: 15px; box-sizing: border-box; height: calc(100vh - 105px); overflow-y: auto; }
        .view.active { display: block; }
        
        nav { position: fixed; bottom: 0; width: 100%; background: #0a0a0a; display: flex; border-top: 1px solid #222; height: 60px; z-index: 100; }
        nav button { flex: 1; background: none; border: none; color: #fff; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        nav button.active { color: var(--accent); }

        #view-clock { padding: 0; position: relative; overflow: hidden; height: calc(100vh - 105px); }
        #view-clock:fullscreen { height: 100vh; width: 100vw; background: #000; }
        #view-clock:fullscreen .clock-main { height: 100vh; }

        .clock-top-settings { display: grid; grid-template-columns: 1fr 1fr 1fr; background: #000; padding: 5px; border-bottom: 1px solid #222; position: relative; z-index: 10; }
        .clock-top-settings div { font-size: 0.6rem; color: #888; text-align: center; }
        .clock-top-settings input { width: 80%; background: #111; border: 1px solid #333; color: #fff; text-align: center; font-size: 0.8rem; padding: 5px; }

        .clock-main { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .clock-face { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #050505; border: 1px solid #111; transition: background 0.1s; -webkit-tap-highlight-color: transparent; }
        .time-stack { display: flex; flex-direction: column; align-items: center; transform: rotate(90deg); }
        
        .delay-display { font-size: 1.8rem; color: var(--accent); font-weight: bold; height: 2rem; visibility: hidden; }
        .delay-active { visibility: visible; }
        .main-time { font-size: 6rem; font-family: monospace; color: #333; line-height: 1; outline: none; }
        .clock-face.active { background: #111; }
        .clock-face.active .main-time { color: #fff; }

        .clock-face.timed-out { background: var(--stop) !important; }
        .clock-face.timed-out .main-time { color: #fff !important; }

        #clock-overlay { position: absolute; bottom: 10px; right: 5px; width: 60px; background: transparent; display: flex; flex-direction: column; gap: 8px; z-index: 30; }
        .side-btn { height: 70px; width: 50px; border: none; color: white; font-weight: 900; border-radius: 8px; cursor: pointer; background: #333; }
        .side-btn span { display: block; transform: rotate(90deg); white-space: nowrap; font-size: 0.9rem; }
        #pause-btn { background: var(--go); }
        
        .unlock-zone { position: absolute; top: 0; bottom: 0; right: 0; width: 60px; z-index: 20; }
        .hidden-ui { display: none !important; }

        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #181818; border: 1px solid #333; color: white; border-radius: 4px; box-sizing: border-box; }
        .action-btn { width: 100%; padding: 15px; background: var(--accent); border: none; color: white; font-weight: bold; border-radius: 4px; margin-top: 10px; }
        .player-row { background: #0a0a0a; padding: 15px; border-bottom: 1px solid #222; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; align-items: center; justify-content: center; }
        .modal-box { background: #111; border: 1px solid #222; width: 85%; max-width: 320px; padding: 20px; text-align: center; border-radius: 6px; box-sizing: border-box; }
        .modal-box p { margin: 0 0 20px 0; font-size: 0.95rem; font-weight: bold; color: #fff; }
        .modal-btn { width: 100%; padding: 12px; background: var(--go); border: none; color: white; font-weight: bold; border-radius: 4px; font-size: 0.9rem; }
    </style>
</head>
<body>

<header><h1>SSCC MOBILE</h1></header>

<div id="confirmation-modal" class="modal-overlay">
    <div class="modal-box">
        <p>Match Submitted Successfully!</p>
        <button class="modal-btn" onclick="closeModal()">OK</button>
    </div>
</div>

<div id="view-players" class="view active">
    <div id="player-list-container"></div>
</div>

<div id="view-match" class="view">
    <div style="background: #111; padding: 12px; border: 1px solid #222; border-radius: 6px; margin-bottom: 15px;">
        <div style="color: var(--accent); font-weight: bold; font-size: 0.9rem; margin-bottom: 8px;">🏆 TOURNAMENT ENGINE</div>
        
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-bottom: 10px;">
            <select id="tourney-format" style="margin:0; padding:8px;">
                <option value="round-robin">Round Robin (All-Play-All)</option>
                <option value="elo-proximity">Swiss / ELO Proximity</option>
            </select>
            <button class="action-btn" style="margin:0; padding:8px; background: var(--go);" onclick="startNewTournament()">Start</button>
        </div>

        <div id="tourney-roster-section">
            <div style="font-size: 0.7rem; color: #888; margin-bottom: 4px;">CHECK IN ACTIVE PLAYERS:</div>
            <div id="tournament-roster" style="max-height: 110px; overflow-y: auto; font-size: 0.8rem; background: #000; padding: 8px; border-radius: 4px;">
                </div>
        </div>

        <div id="tourney-active-dashboard" style="display: none; margin-top: 5px;">
            <div style="display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 6px; border-radius: 4px;">
                <span id="current-round-display" style="font-weight: bold; font-size: 0.85rem; color: #fff;">Round 1</span>
                <div style="display: flex; gap: 5px;">
                    <button class="action-btn" style="margin:0; padding: 4px 8px; width:auto; font-size:0.75rem; background:#333;" onclick="changeRound(-1)">◀</button>
                    <button class="action-btn" style="margin:0; padding: 4px 8px; width:auto; font-size:0.75rem; background:#333;" onclick="changeRound(1)">▶</button>
                </div>
            </div>
            <div id="active-pairings-list" style="margin-top: 8px; font-size: 0.8rem; display: flex; flex-direction: column; gap: 4px;">
                </div>
        </div>
    </div>

    <select id="format" onchange="updatePlayerDropdowns()">
        <option value="Regular">Regular</option>
        <option value="Quick">Quick</option>
        <option value="Blitz">Blitz</option>
    </select>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div><select id="p1-select" onchange="updateEloField('p1')"><option value="">P1</option></select><input type="number" id="p1elo" placeholder="ELO" readonly></div>
        <div><select id="p2-select" onchange="updateEloField('p2')"><option value="">P2</option></select><input type="number" id="p2elo" placeholder="ELO" readonly></div>
    </div>
    
    <select id="opening">
        <option value="" disabled selected>Choose Opening...</option>
        <option value="A00: Uncommon / Flank">Flank Openings (A00)</option>
        <option value="B01: Scandinavian Defense">Scandinavian Defense (B01)</option>
        <option value="B10: Caro-Kann Defense">Caro-Kann Defense (B10)</option>
        <option value="B20: Sicilian Defense">Sicilian Defense (B20)</option>
        <option value="C00: French Defense">French Defense (C00)</option>
        <option value="C41: Philidor Defense">Philidor Defense (C41)</option>
        <option value="C50: Italian Game / Giuoco Piano">Italian Game (C50)</option>
        <option value="C60: Ruy Lopez (Spanish)">Ruy Lopez (C60)</option>
        <option value="D00: Queen's Pawn Game">Queen's Pawn Game (D00)</option>
        <option value="D02: London System">London System (D02)</option>
        <option value="D06: Queen's Gambit">Queen's Gambit (D06)</option>
        <option value="E00: Indian Defenses">Indian Defenses (E00)</option>
    </select>

    <select id="result">
        <option value="" disabled selected>Choose Winner...</option>
        <option value="1-0">1-0 (White Wins)</option>
        <option value="0-1">0-1 (Black Wins)</option>
        <option value="0.5-0.5">½-½ (Draw)</option>
    </select>
    <button class="action-btn" onclick="submitMatch()">SUBMIT MATCH</button>
</div>

<div id="view-clock" class="view">
    <div id="top-bar" class="clock-top-settings">
        <div>MINUTES<br><input type="number" id="cfg-time" value="5"></div>
        <div>INCREMENT<br><input type="number" id="cfg-inc" value="0"></div>
        <div>DELAY<br><input type="number" id="cfg-delay" value="0"></div>
    </div>
    <div class="clock-main">
        <div id="black-timer" class="clock-face" onmousedown="switchClock('white')" ontouchstart="switchClock('white')">
            <div class="time-stack">
                <div id="black-delay" class="delay-display">0</div>
                <div id="txt-black-time" class="main-time" oninput="parseManualTime('black')" onclick="event.stopPropagation()" ontouchstart="event.stopPropagation()">05:00</div>
            </div>
        </div>
        <div id="white-timer" class="clock-face active" onmousedown="switchClock('black')" ontouchstart="switchClock('black')">
            <div class="time-stack">
                <div id="white-delay" class="delay-display">0</div>
                <div id="txt-white-time" class="main-time" oninput="parseManualTime('white')" onclick="event.stopPropagation()" ontouchstart="event.stopPropagation()">05:00</div>
            </div>
        </div>
    </div>
    <div id="unlock-trigger" class="unlock-zone" onmousedown="startHold()" onmouseup="endHold()" ontouchstart="startHold()" ontouchend="endHold()"></div>
    <div id="clock-overlay">
        <button id="reset-btn" class="side-btn" onclick="resetClock()"><span>RESET</span></button>
        <button id="pause-btn" class="side-btn" onclick="armClock()"><span>START</span></button>
    </div>
</div>

<div id="view-admin" class="view">
    <input type="text" id="reg-name" placeholder="New Player Name">
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;">
        <input type="number" id="reg-elo-reg" placeholder="Reg ELO">
        <input type="number" id="reg-elo-quick" placeholder="Quick ELO">
        <input type="number" id="reg-elo-blitz" placeholder="Blitz ELO">
    </div>
    <button class="action-btn" onclick="registerPlayer()">ADD TO DATABASE</button>
</div>

<nav id="main-nav">
    <button onclick="showView('view-players')" class="nav-btn active">Players</button>
    <button onclick="showView('view-match')" class="nav-btn">Record</button>
    <button onclick="showView('view-clock')" class="nav-btn">Clock</button>
    <button onclick="showView('view-admin')" class="nav-btn">Admin</button>
</nav>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwI9YbFUJzr0dO6i_DsCAA_uyd76flIhQQh5pwXsRARaViVm2hv8ZPxfOOzzAmR-yhu/exec';
    let allPlayers = []; 
    let timers = { white: 300, black: 300 }, active = null, ticker = null, delayLeft = 0;
    let isArmed = false, holdTimer;
    
    let tournamentRounds = [];
    let currentTourneyRoundIdx = 0;

    window.addEventListener('beforeunload', (e) => {
        if (isArmed) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    }

    async function loadPlayers() {
        try {
            const resp = await fetch(SCRIPT_URL);
            allPlayers = await resp.json();
            updatePlayerDropdowns();
            renderList(allPlayers);
            updateTournamentRosterList();
        } catch(e) {}
    }

    function renderList(list) {
        document.getElementById('player-list-container').innerHTML = list
            .filter(p => p && p[0] && p[0].trim() !== '') 
            .map(p => {
                let stats = [];
                if (p[1]) stats.push(`Reg: ${p[1]}`);
                if (p[2]) stats.push(`Quick: ${p[2]}`);
                if (p[3]) stats.push(`Blitz: ${p[3]}`);
                
                return `
                    <div class="player-row">
                        <div style="font-weight:bold;">${p[0]}</div>
                        ${stats.length ? `<div style="font-size:0.7rem;color:#888;">${stats.join(' | ')}</div>` : ''}
                    </div>`;
            }).join('');
    }

    function updateTournamentRosterList() {
        const rosterContainer = document.getElementById('tournament-roster');
        if (!rosterContainer) return;
        rosterContainer.innerHTML = allPlayers
            .filter(p => p && p[0] && p[0].trim() !== '')
            .map((p, idx) => `
                <label style="display: block; margin-bottom: 6px; color: #eee; user-select: none;">
                    <input type="checkbox" class="tourney-player-check" value="${p[0]}" data-idx="${idx}" style="width:auto; margin:0 8px 0 0;">
                    ${p[0]}
                </label>
            `).join('');
    }

    function startNewTournament() {
        const checkboxes = document.querySelectorAll('.tourney-player-check:checked');
        let players = [];
        
        checkboxes.forEach(cb => {
            players.push(cb.value);
        });

        if (players.length < 2) {
            alert("Please check at least 2 players to start.");
            return;
        }

        const mode = document.getElementById('tourney-format').value;
        tournamentRounds = [];
        currentTourneyRoundIdx = 0;

        if (mode === 'round-robin') {
            generateRoundRobinSchedule(players);
        } else {
            generateEloProximitySchedule(players);
        }

        document.getElementById('tourney-roster-section').style.display = 'none';
        document.getElementById('tourney-active-dashboard').style.display = 'block';
        
        displayRound(0);
    }

    function generateRoundRobinSchedule(playerList) {
        let pool = [...playerList].sort(() => Math.random() - 0.5);
        
        if (pool.length % 2 !== 0) {
            pool.push("BYE");
        }

        const numPlayers = pool.length;
        const numRounds = numPlayers - 1;
        const halfSize = numPlayers / 2;

        for (let round = 0; round < numRounds; round++) {
            let roundPairings = [];
            
            for (let i = 0; i < halfSize; i++) {
                const whitePlayer = pool[i];
                const blackPlayer = pool[numPlayers - 1 - i];

                if (whitePlayer !== "BYE" && blackPlayer !== "BYE") {
                    if (round % 2 === 0) {
                        roundPairings.push({ white: whitePlayer, black: blackPlayer });
                    } else {
                        roundPairings.push({ white: blackPlayer, black: whitePlayer });
                    }
                } else {
                    const activePlayer = whitePlayer === "BYE" ? blackPlayer : whitePlayer;
                    roundPairings.push({ white: activePlayer, black: "BYE", isBye: true });
                }
            }
            tournamentRounds.push(roundPairings);
            pool.splice(1, 0, pool.pop());
        }
    }

    function generateEloProximitySchedule(playerList) {
        const currentFormat = document.getElementById('format').value;
        const eloIdx = (currentFormat === 'Quick') ? 2 : (currentFormat === 'Blitz' ? 3 : 1);
        
        let structured = playerList.map(name => {
            const match = allPlayers.find(p => p[0] === name);
            return { name: name, elo: parseInt(match ? match[eloIdx] : 1200) || 1200 };
        });

        structured.sort((a, b) => b.elo - a.elo);

        let roundPairings = [];
        for (let i = 0; i < structured.length; i += 2) {
            if (structured[i + 1]) {
                roundPairings.push({ white: structured[i].name, black: structured[i + 1].name });
            } else {
                roundPairings.push({ white: structured[i].name, black: "BYE", isBye: true });
            }
        }
        tournamentRounds.push(roundPairings);
    }

    function displayRound(idx) {
        if (idx < 0 || idx >= tournamentRounds.length) return;
        currentTourneyRoundIdx = idx;
        
        document.getElementById('current-round-display').innerText = `Round ${idx + 1} of ${tournamentRounds.length}`;
        
        const container = document.getElementById('active-pairings-list');
        const pairings = tournamentRounds[idx];

        container.innerHTML = pairings.map((pair) => {
            if (pair.isBye) {
                return `<div style="padding:6px; background:#1a1a1a; color:#888; border-radius:4px;">💤 ${pair.white} has a BYE</div>`;
            }
            return `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#222; padding:5px 8px; border-radius:4px;">
                    <span>⚪ ${pair.white} vs ⚫ ${pair.black}</span>
                    <button class="action-btn" style="margin:0; width:auto; padding:3px 8px; font-size:0.7rem; background:var(--accent);" 
                        onclick="loadPairingToForm('${pair.white}', '${pair.black}')">Load</button>
                </div>
            `;
        }).join('');
    }

    function changeRound(direction) {
        const nextIdx = currentTourneyRoundIdx + direction;
        if (nextIdx >= 0 && nextIdx < tournamentRounds.length) {
            displayRound(nextIdx);
        }
    }

    function loadPairingToForm(whiteName, blackName) {
        document.getElementById('p1-select').value = whiteName;
        updateEloField('p1');
        document.getElementById('p2-select').value = blackName;
        updateEloField('p2');
    }

    function updatePlayerDropdowns() {
        const f = document.getElementById('format').value;
        let idx = (f === 'Quick') ? 2 : (f === 'Blitz' ? 3 : 1);
        const opt = '<option value="">Select Player...</option>' + allPlayers.map(p => `<option value="${p[0]}" data-elo="${p[idx]||''}">${p[0]}</option>`).join('');
        document.getElementById('p1-select').innerHTML = opt;
        document.getElementById('p2-select').innerHTML = opt;
    }

    function updateEloField(p) {
        const s = document.getElementById(p + '-select');
        const elo = s.options[s.selectedIndex]?.getAttribute('data-elo') || '';
        document.getElementById(p + 'elo').value = elo;
    }

    async function registerPlayer() {
        const n = document.getElementById('reg-name');
        const data = { action: 'addPlayer', name: n.value, reg: document.getElementById('reg-elo-reg').value, quick: document.getElementById('reg-elo-quick').value, blitz: document.getElementById('reg-elo-blitz').value };
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
        loadPlayers();
    }

    async function submitMatch() {
        const p1Value = document.getElementById('p1-select').value;
        const p2Value = document.getElementById('p2-select').value;

        const d = {
            action: 'addMatch', 
            p1: p1Value, p1elo: document.getElementById('p1elo').value,
            p2: p2Value, p2elo: document.getElementById('p2elo').value,
            white: p1Value, black: p2Value,
            opening: document.getElementById('opening').value, result: document.getElementById('result').value, format: document.getElementById('format').value
        };
        
        try {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(d) });
            document.getElementById('confirmation-modal').style.display = 'flex';
        } catch(e) {}
    }

    function closeModal() {
        document.getElementById('confirmation-modal').style.display = 'none';
        
        document.getElementById('p1-select').value = "";
        document.getElementById('p2-select').value = "";
        document.getElementById('p1elo').value = "";
        document.getElementById('p2elo').value = "";
        document.getElementById('opening').selectedIndex = 0;
        document.getElementById('result').selectedIndex = 0;
    }

    function armClock() {
        isArmed = true; 
        active = null; 
        const base = (parseInt(document.getElementById('cfg-time').value) || 5) * 60;
        timers = { white: base, black: base };
        updateClock();
        
        document.getElementById('txt-white-time').removeAttribute('contenteditable');
        document.getElementById('txt-black-time').removeAttribute('contenteditable');
        
        document.getElementById('clock-overlay').classList.add('hidden-ui');
        document.getElementById('top-bar').classList.add('hidden-ui');
        document.getElementById('main-nav').classList.add('hidden-ui');
        document.querySelectorAll('.clock-face').forEach(c => c.classList.remove('timed-out'));

        const clockView = document.getElementById('view-clock');
        if (clockView.requestFullscreen) {
            clockView.requestFullscreen().catch(() => {});
        } else if (clockView.webkitRequestFullscreen) {
            clockView.webkitRequestFullscreen();
        }
    }

    function switchClock(nextPlayer) { 
        if(!isArmed) return;
        
        const overlay = document.getElementById('clock-overlay');
        if (!overlay.classList.contains('hidden-ui')) return;
        
        if(active && timers[active] <= 0) return;

        if(!ticker) {
            active = nextPlayer;
            delayLeft = parseInt(document.getElementById('cfg-delay').value) || 0;
            startTicker();
        } else {
            if(active && nextPlayer !== active) {
                timers[active] += parseInt(document.getElementById('cfg-inc').value) || 0;
                document.getElementById(active + '-delay').classList.remove('delay-active');
            }
            active = nextPlayer;
            delayLeft = parseInt(document.getElementById('cfg-delay').value) || 0;
        }
        document.querySelectorAll('.clock-face').forEach(c => c.classList.remove('active'));
        document.getElementById(nextPlayer + '-timer').classList.add('active');
        updateClock();
    }

    function startTicker() {
        if (ticker) return;
        ticker = setInterval(() => { 
            if (!active) return;
            const delayEl = document.getElementById(active + '-delay');
            if (delayLeft > 0) {
                delayEl.innerText = delayLeft;
                delayEl.classList.add('delay-active');
                delayLeft--;
            } else {
                delayEl.classList.remove('delay-active');
                timers[active]--; 
                updateClock(); 
                
                if (timers[active] <= 0) { 
                    clearInterval(ticker); 
                    ticker = null;
                    document.getElementById(active + '-timer').classList.add('timed-out');
                }
            }
        }, 1000); 
    }

    function updateClock() {
        ['white','black'].forEach(p => {
            if (document.activeElement === document.getElementById(`txt-${p}-time`)) return;
            const m = Math.floor(timers[p]/60), s = timers[p]%60;
            document.getElementById(`txt-${p}-time`).innerText = `${m}:${s<10?'0'+s:s}`;
        });
    }

    function parseManualTime(player) {
        const text = document.getElementById(`txt-${player}-time`).innerText.trim();
        const parts = text.split(':');
        let totalSeconds = 0;
        if (parts.length === 2) {
            const mins = parseInt(parts[0], 10) || 0;
            const secs = parseInt(parts[1], 10) || 0;
            totalSeconds = (mins * 60) + secs;
        } else {
            totalSeconds = parseInt(text, 10) || 0;
        }
        if (totalSeconds >= 0) {
            timers[player] = totalSeconds;
            if (totalSeconds > 0) {
                document.getElementById(`${player}-timer`).classList.remove('timed-out');
            }
        }
    }

    function resetClock() {
        clearInterval(ticker); ticker = null; active = null; isArmed = false;
        const base = (parseInt(document.getElementById('cfg-time').value) || 5) * 60;
        timers = { white: base, black: base };
        
        document.getElementById('txt-white-time').setAttribute('contenteditable', 'true');
        document.getElementById('txt-black-time').setAttribute('contenteditable', 'true');
        
        document.getElementById('clock-overlay').classList.remove('hidden-ui');
        document.getElementById('top-bar').classList.remove('hidden-ui');
        document.getElementById('main-nav').classList.remove('hidden-ui');
        document.querySelectorAll('.clock-face').forEach(c => {
            c.classList.remove('timed-out');
            c.classList.remove('active');
        });
        document.querySelectorAll('.delay-display').forEach(d => {
            d.classList.remove('delay-active');
            d.innerText = "0";
        });
        updateClock();

        if (document.fullscreenElement || document.webkitFullscreenElement) {
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    }

    function startHold() { 
        if(!isArmed) return;
        holdTimer = setTimeout(() => { 
            const overlay = document.getElementById('clock-overlay');
            if (!overlay.classList.contains('hidden-ui')) {
                if(document.activeElement) document.activeElement.blur();
                document.getElementById('txt-white-time').removeAttribute('contenteditable');
                document.getElementById('txt-black-time').removeAttribute('contenteditable');
                overlay.classList.add('hidden-ui');
                document.getElementById('top-bar').classList.add('hidden-ui');
                document.getElementById('main-nav').classList.add('hidden-ui');
                if (active && timers[active] > 0) {
                    startTicker();
                }
            } else {
                if (ticker) {
                    clearInterval(ticker);
                    ticker = null;
                }
                document.getElementById('txt-white-time').setAttribute('contenteditable', 'true');
                document.getElementById('txt-black-time').setAttribute('contenteditable', 'true');
                overlay.classList.remove('hidden-ui'); 
                document.getElementById('top-bar').classList.remove('hidden-ui');
                document.getElementById('main-nav').classList.remove('hidden-ui');
            }
        }, 1500); 
    }
    function endHold() { clearTimeout(holdTimer); }

    window.onload = loadPlayers;
</script>
</body>
</html>
