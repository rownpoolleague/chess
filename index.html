<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="icon.png">
    <title>SSCC MOBILE</title>
    <style>
        :root { --bg: #000; --card: #111; --accent: #3b82f6; --text: #eee; --go: #22c55e; --stop: #ef4444; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100vh; }
        header { background: var(--card); padding: 10px; text-align: center; border-bottom: 1px solid #222; height: 45px; box-sizing: border-box; }
        h1 { margin: 0; font-size: 1rem; color: var(--accent); }
        .view { display: none; padding: 15px; box-sizing: border-box; height: calc(100vh - 105px); overflow-y: auto; }
        .view.active { display: block; }
        nav { position: fixed; bottom: 0; width: 100%; background: #0a0a0a; display: flex; border-top: 1px solid #222; height: 60px; z-index: 100; }
        nav button { flex: 1; background: none; border: none; color: #fff; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        nav button.active { color: var(--accent); }
        #view-clock { padding: 0; position: relative; overflow: hidden; height: calc(100vh - 105px); }
        .clock-top-settings { display: grid; grid-template-columns: 1fr 1fr 1fr; background: #000; padding: 5px; border-bottom: 1px solid #222; position: relative; z-index: 10; }
        .clock-top-settings div { font-size: 0.6rem; color: #888; text-align: center; }
        .clock-top-settings input { width: 80%; background: #111; border: 1px solid #333; color: #fff; text-align: center; font-size: 0.8rem; padding: 5px; }
        .clock-main { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .clock-face { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #050505; border: 1px solid #111; transition: background 0.1s; touch-action: none; -webkit-tap-highlight-color: transparent; }
        .time-stack { display: flex; flex-direction: column; align-items: center; transform: rotate(90deg); pointer-events: none; }
        .delay-display { font-size: 1.8rem; color: var(--accent); font-weight: bold; height: 2rem; visibility: hidden; }
        .delay-active { visibility: visible; }
        .main-time { font-size: 6rem; font-family: monospace; color: #333; line-height: 1; outline: none; }
        .clock-face.active { background: #111; }
        .clock-face.active .main-time { color: #fff; }
        .clock-face.timed-out { background: var(--stop) !important; }
        #clock-overlay { position: absolute; bottom: 10px; right: 5px; width: 60px; display: flex; flex-direction: column; gap: 8px; z-index: 30; }
        .side-btn { height: 70px; width: 50px; border: none; color: white; font-weight: 900; border-radius: 8px; background: #333; }
        .side-btn span { display: block; transform: rotate(90deg); }
        .unlock-zone { position: absolute; top: 0; bottom: 0; right: 0; width: 60px; z-index: 20; }
        .hidden-ui { display: none !important; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #181818; border: 1px solid #333; color: white; border-radius: 4px; box-sizing: border-box; }
        .action-btn { width: 100%; padding: 15px; background: var(--accent); border: none; color: white; font-weight: bold; border-radius: 4px; margin-top: 10px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; align-items: center; justify-content: center; }
        .modal-box { background: #111; border: 1px solid #222; width: 85%; padding: 20px; text-align: center; border-radius: 6px; }
    </style>
</head>
<body>

<header><h1>SSCC MOBILE</h1></header>

<div id="view-match" class="view active">
    </div>

<div id="view-clock" class="view">
    <div id="top-bar" class="clock-top-settings">
        <div>MINUTES<br><input type="number" id="cfg-time" value="5"></div>
        <div>INCREMENT<br><input type="number" id="cfg-inc" value="0"></div>
        <div>DELAY<br><input type="number" id="cfg-delay" value="0"></div>
    </div>
    <div class="clock-main">
        <div id="black-timer" class="clock-face" onpointerdown="handleClockTap(event, 'white')">
            <div class="time-stack">
                <div id="black-delay" class="delay-display">0</div>
                <div id="txt-black-time" class="main-time">05:00</div>
            </div>
        </div>
        <div id="white-timer" class="clock-face active" onpointerdown="handleClockTap(event, 'black')">
            <div class="time-stack">
                <div id="white-delay" class="delay-display">0</div>
                <div id="txt-white-time" class="main-time">05:00</div>
            </div>
        </div>
    </div>
    <div id="unlock-trigger" class="unlock-zone" onpointerdown="startHold()" onpointerup="endHold()"></div>
    <div id="clock-overlay">
        <button id="reset-btn" class="side-btn" onpointerdown="resetClock()"><span>RESET</span></button>
        <button id="pause-btn" class="side-btn" onpointerdown="armClock()"><span>START</span></button>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwI9YbFUJzr0dO6i_DsCAA_uyd76flIhQQh5pwXsRARaViVm2hv8ZPxfOOzzAmR-yhu/exec';
    let timers = { white: 300, black: 300 }, active = null, ticker = null, delayLeft = 0, isArmed = false, holdTimer;

    function handleClockTap(e, player) {
        e.preventDefault();
        switchClock(player);
    }

    function switchClock(nextPlayer) { 
        if(!isArmed) return;
        const overlay = document.getElementById('clock-overlay');
        if (!overlay.classList.contains('hidden-ui')) return;
        if(active && timers[active] <= 0) return;

        if(!ticker) {
            active = nextPlayer;
            delayLeft = parseInt(document.getElementById('cfg-delay').value) || 0;
            startTicker();
        } else {
            if(active && nextPlayer !== active) {
                timers[active] += parseInt(document.getElementById('cfg-inc').value) || 0;
                document.getElementById(active + '-delay').classList.remove('delay-active');
            }
            active = nextPlayer;
            delayLeft = parseInt(document.getElementById('cfg-delay').value) || 0;
        }
        document.querySelectorAll('.clock-face').forEach(c => c.classList.remove('active'));
        document.getElementById(nextPlayer + '-timer').classList.add('active');
        updateClock();
    }

    function startTicker() {
        if (ticker) return;
        ticker = setInterval(() => { 
            if (!active) return;
            const delayEl = document.getElementById(active + '-delay');
            if (delayLeft > 0) {
                delayEl.innerText = delayLeft;
                delayEl.classList.add('delay-active');
                delayLeft--;
            } else {
                delayEl.classList.remove('delay-active');
                timers[active]--; 
                updateClock(); 
                if (timers[active] <= 0) { 
                    clearInterval(ticker); ticker = null;
                    document.getElementById(active + '-timer').classList.add('timed-out');
                }
            }
        }, 1000); 
    }

    function updateClock() {
        ['white','black'].forEach(p => {
            const m = Math.floor(timers[p]/60), s = timers[p]%60;
            document.getElementById(`txt-${p}-time`).innerText = `${m}:${s<10?'0'+s:s}`;
        });
    }

    function armClock() {
        isArmed = true; active = null;
        const base = (parseInt(document.getElementById('cfg-time').value) || 5) * 60;
        timers = { white: base, black: base };
        updateClock();
        document.getElementById('clock-overlay').classList.add('hidden-ui');
        document.getElementById('top-bar').classList.add('hidden-ui');
    }

    function resetClock() {
        clearInterval(ticker); ticker = null; active = null; isArmed = false;
        const base = (parseInt(document.getElementById('cfg-time').value) || 5) * 60;
        timers = { white: base, black: base };
        document.getElementById('clock-overlay').classList.remove('hidden-ui');
        document.getElementById('top-bar').classList.remove('hidden-ui');
        updateClock();
    }

    function startHold() { holdTimer = setTimeout(() => { document.getElementById('clock-overlay').classList.remove('hidden-ui'); }, 1500); }
    function endHold() { clearTimeout(holdTimer); }
</script>
</body>
</html>
