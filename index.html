<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/chess/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Club Main Menu</title>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; font-family: Arial, sans-serif;
            background-color: #000000; color: white;
        }

        .overlay {
            display: flex; flex-direction: column;
            justify-content: center; padding: 20px 10px;
        }
        h1 { text-align: center; margin-bottom: 20px; font-size: 32px; }

        .link-card {
            max-width: 500px;
            margin: 0 auto;
            width: 90%;
            background: #111;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .menu-container {
            display: flex; flex-direction: column; gap: 15px;
        }

        .menu-button {
            display: block; text-align: center; padding: 10px; 
            background: #1e90ff; color: white; text-decoration: none; 
            font-size: 20px; border-radius: 8px; font-weight: bold; 
            width: 100%; cursor: pointer; transition: background 0.2s;
            border: none;
        }
        .menu-button:hover { background: #187bcd; }

        footer { text-align: center; padding: 20px; }
        .footer-logo { max-width: 150px; opacity: 0.8; }
    </style>
</head>

<body>

    <!-- ADMIN MODAL -->
    <div id="adminModal" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:9999;">
        <div style="background:#111; padding:30px; border-radius:10px; width:300px; border:2px solid #1e90ff; text-align:center;">
            <h2 style="color:white; margin-top:0;">Admin Login</h2>
            <input id="adminPass" type="password" placeholder="Password" style="width:100%; padding:10px; font-size:18px; margin-bottom:20px;">
            <button onclick="submitAdminPassword()" style="width:100%; padding:10px; font-size:20px; background:#1e90ff; color:white; border:none; border-radius:6px;">Enter</button>
        </div>
    </div>

    <!-- MAIN MENU -->
    <div class="overlay">
        <h1>Main Menu</h1>
        
        <div class="link-card">
            <div class="menu-container">
                <a class="menu-button" href="calendar.html" onclick="goTo(event, this.href)">Calendar</a>
                <a class="menu-button" href="members.html" onclick="goTo(event, this.href)">SSCC Members</a>
                <a class="menu-button" href="tournamentdata.html" onclick="goTo(event, this.href)">Pairings/Results</a>
                <a class="menu-button" href="Clock.html" onclick="goTo(event, this.href)">Clock</a>
                <a class="menu-button" href="submit.html" onclick="goTo(event, this.href)">Submit a Club Game</a>
                <a class="menu-button" href="viewer.html" onclick="goTo(event, this.href)">Load PGN</a>
                <a class="menu-button" href="admin.html" onclick="goTo(event, this.href, true)">Admin</a>
                <a class="menu-button" href="testy.html" onclick="goTo(event, this.href)">Submit test</a>

                <!-- NOTIFICATION BUTTON -->
                <button class="menu-button" onclick="enableNotifications()">Enable Notifications</button>
            </div>
        </div>
    </div>

    <footer>
        <img src="iconking.png" alt="Club Logo" class="footer-logo">
    </footer>

    <!-- FIREBASE + NOTIFICATION LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBek60G1Ns_PVhODcp02H0S2jryhdUKFuQ",
            authDomain: "sscc-push.firebaseapp.com",
            projectId: "sscc-push",
            storageBucket: "sscc-push.firebasestorage.app",
            messagingSenderId: "954838466310",
            appId: "1:954838466310:web:d7ba03562b6c0b8db66887"
        };

        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app);

        window.enableNotifications = async () => {
            const permission = await Notification.requestPermission();
            if (permission !== 'granted') {
                alert("Permission denied.");
                return;
            }

            try {
                const swReg = await navigator.serviceWorker.ready;

                const token = await getToken(messaging, {
                    vapidKey: 'BAvXMdABPFn8frEfnMHIN00x5VImnSdUK4YTKUqc_V5ffdl-kDjisn_n1ePSzl_HP2H1KxJs6O7KnwbFPoiy03Y',
                    serviceWorkerRegistration: swReg
                });

                if (!token) {
                    alert("Failed to get token.");
                    return;
                }

                // Save token to Apps Script
                await fetch("https://script.google.com/macros/s/AKfycbxtJIpGdp9rPOt-YgTbS4dnswR2heLhreZdpK7eo6TDhjizZShmoMgsw2ww1G8pvRiz/exec", {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "saveToken", token })
                });

                // Subscribe to /topics/all
                await fetch("https://iid.googleapis.com/iid/v1/" + token + "/rel/topics/all", {
                    method: "POST",
                    headers: {
                        "Authorization": "key=0f358ec0c7c5e96b8110006ce670a1f168d7b48d"
                    }
                });

                alert("Notifications Enabled!");

            } catch (err) {
                alert("Token error: " + err);
                console.error(err);
            }
        };

        navigator.serviceWorker.register('/chess/sw.js')
            .then(() => console.log('Service Worker ready'))
            .catch((err) => alert("SW Registration failed: " + err));
    </script>

    <!-- ADMIN + NAVIGATION -->
    <script>
        function goTo(event, url, isAdmin = false) {
            event.preventDefault();
            if (isAdmin) {
                const modal = document.getElementById("adminModal");
                modal.style.display = "flex";
                modal.dataset.url = url;
                return;
            }
            window.location.href = url;
        }

        async function submitAdminPassword() {
            const pass = document.getElementById("adminPass").value.trim();
            if (!pass) return;

            try {
                const resp = await fetch("https://script.google.com/macros/s/AKfycbxtJIpGdp9rPOt-YgTbS4dnswR2heLhreZdpK7eo6TDhjizZShmoMgsw2ww1G8pvRiz/exec", {
                    method: "POST",
                    body: JSON.stringify({ action: "checkAdminPassword", password: pass })
                });

                const data = await resp.json();
                if (!data.ok) { alert("Incorrect password."); return; }

                sessionStorage.setItem("adminAuth", "ok");
                window.location.href = document.getElementById("adminModal").dataset.url;

            } catch (err) {
                console.error(err);
            }
        }
    </script>

</body>
</html>
