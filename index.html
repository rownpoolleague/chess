<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Club Main Menu</title>
<link rel="manifest" href="manifest.json">

<!-- THESE TWO LINES FORCED THE APP CHASSIS TO INTEGRATE DIRECTLY INTO THE STATUS BAR OVERLAY -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Standard favicon for browser tabs -->
<link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/rownpoolleague/chess/main/icon.png">
<!-- iOS Home Screen icon -->
<link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/rownpoolleague//chess/main/icon.png">
<!-- Android / Chrome Home Screen icon -->
<link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/rownpoolleague//chess/main/icon.png">
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    background-color: #000; /* Pure black seals any possible background color bleeding entirely */
    overflow: hidden; /* Prevents bounce scrolling on full screen mobile apps */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.form-wrapper {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    height: 100dvh; 
    border: 4px solid #1e90ff;
    border-radius: 12px; /* Curves matching your members and clock files */
    display: flex;
    flex-direction: column;
    justify-content: space-between; /* Pushes main content to top/center and footer to absolute bottom */
    
    /* Accounts for physical notches and home bar overlays in true fullscreen mode */
    padding-top: env(safe-area-inset-top, 12px);
    padding-bottom: env(safe-area-inset-bottom, 12px);
    padding-left: env(safe-area-inset-left, 4px);
    padding-right: env(safe-area-inset-right, 4px);
}
.overlay {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center; /* Centers menu vertically within available space */
    padding: 20px 10px;
}
h1 {
    text-align: center;
    color: white;
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 32px;
}
.menu-container {
    max-width: 500px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.menu-button {
    display: block;
    margin-left: auto;
    margin-right: auto;
    text-align: center;
    padding: 4px;
    background: #1e90ff;
    color: white;
    text-decoration: none;
    font-size: 24px;
    border-radius: 8px;
    font-weight: bold;
    height: 36px;
    line-height: 28px; /* Vertically aligns text nicely inside button */
    width: 250px;
    cursor: pointer;
}
/* Footer styling for logo */
footer {
    text-align: center;
    padding: 10px 20px;
}
.footer-logo {
    max-width: 200px;
    max-height: 15dvh; /* Limits logo size dynamically so it never overflows smaller displays */
    height: auto;
    width: auto;
}
</style>
</head>
<body>
    <div class="form-wrapper">
        <div class="overlay">
            <h1>Main Menu</h1>
            <div class="menu-container">
                <a class="menu-button" href="members.html" onclick="goTo(event, this.href)">SSCC Members</a>
                <a class="menu-button" href="tournamentmenu.html" onclick="goTo(event, this.href)">Tournament</a>
                <a class="menu-button" href="Clock.html" onclick="goTo(event, this.href)">Clock</a>
                <a class="menu-button" href="submit.html" onclick="goTo(event, this.href)">Submit a Match</a>
            </div>
        </div>
        <footer>
           <img src="icon.png" alt="Club Logo" class="footer-logo">
    </div>

    <script>
        // Forces pages to open inline inside the standalone fullscreen container app
        function goTo(event, url) {
            event.preventDefault();
            window.location.href = url;
        }
    </script>
</body>
</html>
