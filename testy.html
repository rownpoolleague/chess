<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGN File Viewer - Portrait</title>
    <style>
        body { font-family: sans-serif; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .upload-section { margin-bottom: 20px; }
        /* The container for the portrait view */
        .viewer-container { 
            width: 100%; 
            max-width: 400px; 
            aspect-ratio: 0.575; 
            border: 1px solid black; 
        }
        iframe { width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

    <div class="upload-section">
        <label for="pgnFile">Select PGN File:</label>
        <input type="file" id="pgnFile" accept=".pgn,.txt">
    </div>

    <!-- Portrait Container -->
    <div class="viewer-container">
        <iframe name="cwvif_tfvswf" style='width:100%;height:100%;border:0'></iframe>
        <form id="cwvfm_tfvswf" method="post" action='https://caissa.com/bin/gameview' target="cwvif_tfvswf">
            <input id="cwvip_tfvswf" name="edat" type="hidden">
        </form>
    </div>

    <script>
        document.getElementById('pgnFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const pgnContent = event.target.result;
                
                // Inject content and submit the form with the new IDs
                document.getElementById('cwvip_tfvswf').value = pgnContent;
                document.getElementById('cwvfm_tfvswf').submit();
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
