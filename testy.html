<!DOCTYPE html>
<html>
<head>
    <title>PGN Viewer Upload</title>
    <link rel="stylesheet" href="https://unpkg.com/@mliebelt/pgn-viewer/lib/pgn-viewer.css">
    <script src="https://unpkg.com/@mliebelt/pgn-viewer/lib/pgn-viewer.js"></script>
</head>
<body>

    <input type="file" id="pgnFile" accept=".pgn">
    <div id="board"></div>

    <script>
        document.getElementById('pgnFile').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const pgnContent = e.target.result;
                document.getElementById('board').innerHTML = "";
                PGNViewer.loadPgn("board", {
                    pgn: pgnContent,
                    pieceStyle: "wikipedia",
                    boardSize: "400"
                });
            };
            reader.readAsText(file);
        });
    </script>

</body>
</html>
