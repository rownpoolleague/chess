<!DOCTYPE html>
<html>
<head>
    <title>PGN Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        #board { width: 400px; margin: 20px auto; }
        .controls { text-align: center; font-family: sans-serif; }
        #moveList { width: 400px; height: 100px; margin: 10px auto; border: 1px solid #ccc; overflow-y: scroll; padding: 5px; }
    </style>
</head>
<body>
    <div id="board"></div>
    <div class="controls">
        <input type="file" id="fileInput" accept=".pgn">
        <div id="moveList">Moves will appear here...</div>
        <button onclick="prevMove()">Back</button>
        <button onclick="nextMove()">Next</button>
    </div>

    <script>
        var config = {
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            position: 'start'
        };
        var board = Chessboard('board', config);
        var game = new Chess();
        var moveHistory = [];
        var currentMove = 0;

        document.getElementById('fileInput').addEventListener('change', function(e) {
            var reader = new FileReader();
            reader.onload = function(e) {
                game.reset();
                game.load_pgn(e.target.result);
                moveHistory = game.history();
                currentMove = 0;
                board.start();
                document.getElementById('moveList').innerText = moveHistory.join(", ");
            };
            reader.readAsText(e.target.files[0]);
        });

        function nextMove() {
            if (currentMove < moveHistory.length) {
                game.move(moveHistory[currentMove]);
                board.position(game.fen());
                currentMove++;
            }
        }

        function prevMove() {
            if (currentMove > 0) {
                game.undo();
                board.position(game.fen());
                currentMove--;
            }
        }
    </script>
</body>
</html>
