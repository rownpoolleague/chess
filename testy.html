<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOURNAMENT ENGINE</title>
    <style>
        :root { --bg: #000; --accent: #3b82f6; --text: #eee; --go: #22c55e; --danger: #b91c1c; }
        * { box-sizing: border-box; }
        body { margin: 0; height: 100dvh; background: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; height: 100%; padding: 20px; }
        select, input, button { width: 100%; padding: 15px; margin-bottom: 10px; background: #181818; border: 1px solid #333; color: white; border-radius: 4px; }
        .action-btn { background: var(--go); font-weight: bold; cursor: pointer; border: none; }
        .match-card { background: #1a1a1a; padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--accent); }
        .res-btn { flex: 1; padding: 10px; background: #222; border: 1px solid #444; color: white; }
        .active { background: var(--accent); }
    </style>
</head>

<body>
    <div class="wrapper" id="app">
        <div id="setup">
            <input type="text" id="t-name" placeholder="Tournament Name">
            <select id="tc"><option value="regular">Regular</option><option value="quick">Quick</option><option value="blitz">Blitz</option></select>
            <select id="fmt"><option value="swiss">Swiss</option><option value="rr">Round Robin</option></select>
            <input type="number" id="rounds" value="3">
            <div id="roster"></div>
            <button class="action-btn" onclick="init()">START</button>
        </div>
        <div id="active" style="display:none;">
            <div id="status"></div>
            <div id="pairings"></div>
            <button id="next" class="action-btn" onclick="nextRound()" style="display:none;">NEXT ROUND</button>
            <div id="standings"></div>
            <button onclick="resetApp()" style="background:var(--danger)">RESET</button>
        </div>
    </div>

    <script>
        const URL = 'https://script.google.com/macros/s/AKfycbzU3yQ60QE9Yz7vi3ySzR98ltYVTZD9A1cT6oiJ9LleEJObigLwKtHXRWKFQKrq1s_E-A/exec';
        let state = { name: '', tc: 'regular', fmt: 'swiss', players: [], currentRound: 1, totalRounds: 3, pairings: [], history: [] };

        async function load() {
            const saved = localStorage.getItem('t_state');
            if (saved) {
                state = JSON.parse(saved);
                renderActive();
            } else {
                const res = await fetch(URL);
                const data = await res.json();
                const players = (data.players || data).map(p => ({ id: p[0], name: p[0], ratings: { regular: p[1], quick: p[2], blitz: p[3] }, score: 0 }));
                document.getElementById('roster').innerHTML = players.map(p => `<label><input type="checkbox" value="${p.id}" class="p-sel"> ${p.name}</label>`).join('');
            }
        }

        function init() {
            state.name = document.getElementById('t-name').value;
            state.tc = document.getElementById('tc').value;
            state.fmt = document.getElementById('fmt').value;
            state.totalRounds = parseInt(document.getElementById('rounds').value);
            state.players = Array.from(document.querySelectorAll('.p-sel:checked')).map(el => {
                const p = { id: el.value, name: el.value, score: 0 };
                return p;
            });
            save();
            renderActive();
        }

        function renderActive() {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('active').style.display = 'block';
            document.getElementById('status').innerText = `${state.name} - Round ${state.currentRound}`;
            document.getElementById('pairings').innerHTML = state.pairings.map((m, i) => `
                <div class="match-card">${m.w.name} vs ${m.b.name}
                <div style="display:flex; gap:5px;"><button class="res-btn ${m.res=='w'?'active':''}" onclick="setRes(${i},'w')">1-0</button><button class="res-btn ${m.res=='d'?'active':''}" onclick="setRes(${i},'d')">1/2</button><button class="res-btn ${m.res=='b'?'active':''}" onclick="setRes(${i},'b')">0-1</button></div></div>
            `).join('');
            document.getElementById('next').style.display = state.pairings.every(m => m.res) ? 'block' : 'none';
        }

        function setRes(i, res) { state.pairings[i].res = res; save(); renderActive(); }
        function save() { localStorage.setItem('t_state', JSON.stringify(state)); }
        function resetApp() { localStorage.clear(); location.reload(); }
        
        // Initial call
        window.onload = load;
    </script>
</body>
</html>
