<!DOCTYPE html>
<html>
<head>
    <title>PGN Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        #board { width: 400px; margin: 20px auto; }
        .controls { text-align: center; }
        textarea { width: 400px; height: 100px; display: block; margin: 10px auto; }
    </style>
</head>
<body>

    <div id="board"></div>
    <div class="controls">
        <textarea id="pgnInput" placeholder="Paste PGN here..."></textarea>
        <button onclick="loadGame()">Load Game</button>
        <button onclick="prevMove()">Back</button>
        <button onclick="nextMove()">Next</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        // Set piece theme to use standard Wikipedia images
        var config = {
            pieceTheme: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/img/chesspieces/wikipedia/{piece}.png',
            position: 'start'
        };
        var board = Chessboard('board', config);
        var game = new Chess();
        var moveIndex = 0;

        function loadGame() {
            var pgn = document.getElementById('pgnInput').value;
            if (game.load_pgn(pgn)) {
                game.reset(); 
                board.start();
                moveIndex = 0;
            } else {
                alert("Invalid PGN");
            }
        }

        function nextMove() {
            var history = game.history();
            if (moveIndex < history.length) {
                game.move(history[moveIndex]);
                board.position(game.fen());
                moveIndex++;
            }
        }

        function prevMove() {
            if (moveIndex > 0) {
                game.undo();
                board.position(game.fen());
                moveIndex--;
            }
        }
    </script>
</body>
</html>
