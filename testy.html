<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGN File Viewer</title>
    <style>
        body { font-family: sans-serif; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .viewer-container { 
            width: 100%; 
            max-width: 600px; 
            aspect-ratio: 1.5; 
            border: 1px solid #ccc; 
            margin-top: 20px;
            background: #f9f9f9;
        }
        iframe { width: 100%; height: 100%; border: 0; }
        .upload-section { margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="upload-section">
        <label for="pgnFile">Select PGN File:</label>
        <input type="file" id="pgnFile" accept=".pgn,.txt">
    </div>

    <div class="viewer-container">
        <iframe name="caissa_iframe" id="caissa_iframe"></iframe>
        <form id="caissa_form" method="post" action="https://caissa.com/bin/gameview" target="caissa_iframe">
            <input type="hidden" name="edat" id="pgn_data">
        </form>
    </div>

    <script>
        document.getElementById('pgnFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                // Get the raw PGN text
                const pgnContent = event.target.result;
                
                // Inject into the hidden form field
                document.getElementById('pgn_data').value = pgnContent;
                
                // Submit the form to the iframe
                document.getElementById('caissa_form').submit();
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
