<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TOURNAMENT ENGINE</title>
    <style>
        :root { --bg: #000; --card: #111; --accent: #3b82f6; --text: #eee; --go: #22c55e; --danger: #b91c1c; --neutral: #333; }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; background-color: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #password-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; color: white; }
        .form-wrapper { width: 100%; height: 100dvh; border: 4px solid #1e90ff; border-radius: 32px; display: flex; flex-direction: column; overflow: hidden; padding-top: calc(env(safe-area-inset-top, 2px) + 1px); padding-bottom: env(safe-area-inset-bottom, 2px); padding-left: env(safe-area-inset-left, 2px); padding-right: env(safe-area-inset-right, 2px); }
        .engine-box { flex: 1; background: var(--bg); padding: 15px; display: flex; flex-direction: column; overflow-y: auto; }
        select, input, .action-btn { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #333; background: #181818; color: white; font-size: 16px; }
        .action-btn { background: var(--go); border: none; font-weight: bold; cursor: pointer; }
        .p-label { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; cursor: pointer; color: var(--text); }
        .p-label input { width: auto; margin: 0 10px 0 0; }
        .match-card { background: #1a1a1a; padding: 15px; margin-bottom: 10px; border-radius: 4px; border-left: 4px solid #333; color: var(--text); }
        .res-btn { flex: 1; padding: 8px; background: #222; border: 1px solid #444; color: white; cursor: pointer; }
        .res-btn.active { background: var(--accent); }
        .standings { margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; font-size: 0.9rem; color: var(--text); margin-bottom: 20px; }
        .util-row { display: flex; gap: 10px; margin-top: auto; padding-top: 15px; border-top: 1px solid #222; }
        .util-btn { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; color: #fff; background: var(--neutral); border: 1px solid #444; border-radius: 4px; cursor: pointer; }
        .util-btn.reset-color { background: var(--danger); border-color: #991b1b; }
        #t-meta-display { font-size: 1rem; color: #888; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        #t-name-display { font-size: 1.25rem; font-weight: 800; color: #1e90ff; text-transform: uppercase; margin-bottom: 2px; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div id="password-overlay">
        <h3 style="margin-bottom: 20px;">ADMIN ACCESS</h3>
        <input type="password" id="admin-pass-input" placeholder="Enter Password" autocomplete="off">
        <button class="action-btn" onclick="checkPassword()">ENTER</button>
    </div>

    <div class="form-wrapper">
        <div class="engine-box">
            <div id="setup-view" style="display: none;">
                <input type="text" id="t-name-input" placeholder="Tournament Name (e.g., Summer Swiss Open)" autocomplete="off">
                <select id="tc-select" onchange="updateRosterRatings()">
                    <option value="regular">Regular Rating</option>
                    <option value="quick">Quick Rating</option>
                    <option value="blitz">Blitz Rating</option>
                </select>
                <select id="fmt" onchange="toggleRounds()">
                    <option value="swiss">Swiss (USCF Rating Balanced)</option>
                    <option value="rr">Round Robin</option>
                </select>
                <input type="number" id="rnd-count" placeholder="Number of Rounds" value="3">
                <div id="roster-list" style="max-height: 50vh; overflow-y: auto; background: #000; padding: 10px; border-radius: 4px;"></div>
                <button class="action-btn" style="margin-top: 10px;" onclick="startTournament()">BEGIN</button>
            </div>

            <div id="active-view" style="display: none;">
                <div id="t-name-display"></div>
                <div id="t-meta-display"></div>
                <div id="round-title" style="font-weight: bold; margin-bottom: 10px; color: var(--text);"></div>
                <div id="pairings-list"></div>
                <button id="next-btn" class="action-btn" style="display: none;" onclick="processRound()">NEXT ROUND</button>
                <button id="dl-btn" class="action-btn" style="display: none; background: #3b82f6;" onclick="downloadResults()">DOWNLOAD RESULTS</button>
                <div class="standings">
                    <div style="font-weight:bold; margin-bottom: 5px;">STANDINGS</div>
                    <div id="standings-list"></div>
                </div>
            </div>

            <div class="util-row">
                <button class="util-btn" onclick="goToMainMenu()">Main Menu</button>
                <button class="util-btn reset-color" onclick="resetTournament()">Reset Tournament</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxGEVitiaFriLMMlN_gx4ydtzr-W9x2fEJ87JJwyuMuopwB6X44nZKFgQtoJG0Hi1KV0Q/exec';
        let masterRoster = [], players = [], pairings = [], currentRound = 1, totalRounds = 0, format = '', history = [];
        let tournamentName = '', timeControl = 'regular', adminPass = "";
        let playedPairs = new Set(), receivedBye = new Set(), rrSchedules = [];

        async function load() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                adminPass = data.password;
                masterRoster = data.players.map(p => ({
                    id: p[0], name: p[0],
                    ratings: { regular: parseRating(p[1]), quick: parseRating(p[2]), blitz: parseRating(p[3]) },
                    rating: 0, score: 0, colorScore: 0, colorHistory: []
                }));
                // Do NOT call loadState() until password is verified
            } catch (e) { console.error(e); }
        }

        function checkPassword() {
            if (document.getElementById('admin-pass-input').value === adminPass) {
                document.getElementById('password-overlay').style.display = 'none';
                loadState();
            } else {
                alert("Access Denied");
            }
        }

        function parseRating(val) { const p = parseInt(val); return isNaN(p) ? 0 : p; }

        function updateRosterRatings() {
            timeControl = document.getElementById('tc-select').value;
            masterRoster.forEach(p => p.rating = p.ratings[timeControl]);
            const checkedMap = {};
            document.querySelectorAll('.p-select').forEach(cb => checkedMap[cb.value] = cb.checked);
            document.getElementById('roster-list').innerHTML = masterRoster.map(p => {
                const displayRating = p.rating === 0 ? 'UNR' : p.rating;
                return `<label class="p-label"><input type="checkbox" class="p-select" value="${p.id}" ${checkedMap[p.id] ? 'checked' : ''}> ${p.name} (${displayRating})</label>`;
            }).join('');
        }

        function toggleRounds() { document.getElementById('rnd-count').style.display = document.getElementById('fmt').value === 'rr' ? 'none' : 'block'; }

        function saveState() {
            localStorage.setItem('chess_tournament_state', JSON.stringify({ tournamentName, timeControl, players, pairings, currentRound, totalRounds, format, history, playedPairs: Array.from(playedPairs), receivedBye: Array.from(receivedBye), rrSchedules }));
        }

        function loadState() {
            const saved = localStorage.getItem('chess_tournament_state');
            if (!saved) {
                document.getElementById('setup-view').style.display = 'block';
                updateRosterRatings();
                return;
            }
            const state = JSON.parse(saved);
            tournamentName = state.tournamentName; timeControl = state.timeControl; players = state.players; pairings = state.pairings; currentRound = state.currentRound; totalRounds = state.totalRounds; format = state.format; history = state.history; playedPairs = new Set(state.playedPairs); receivedBye = new Set(state.receivedBye); rrSchedules = state.rrSchedules;
            document.getElementById('active-view').style.display = 'block';
            document.getElementById('t-name-display').innerText = tournamentName;
            document.getElementById('t-meta-display').innerText = `${timeControl} · ${format}`;
            render();
        }

        function startTournament() {
            const selectedIds = Array.from(document.querySelectorAll('.p-select:checked')).map(cb => cb.value);
            if (selectedIds.length < 2) return alert("Select at least 2 players");
            tournamentName = document.getElementById('t-name-input').value.trim() || 'CHESS TOURNAMENT';
            timeControl = document.getElementById('tc-select').value;
            format = document.getElementById('fmt').value;
            players = masterRoster.filter(p => selectedIds.includes(p.id)).map(p => ({ id: p.id, name: p.name, rating: p.ratings[timeControl], score: 0, colorScore: 0, colorHistory: [] }));
            currentRound = 1; history = []; playedPairs.clear(); receivedBye.clear(); rrSchedules = [];
            totalRounds = format === 'rr' ? (players.length % 2 === 0 ? players.length - 1 : players.length) : parseInt(document.getElementById('rnd-count').value);
            if (format === 'rr') generateRoundRobinSchedules();
            pairings = generatePairings();
            document.getElementById('setup-view').style.display = 'none';
            document.getElementById('active-view').style.display = 'block';
            document.getElementById('t-name-display').innerText = tournamentName;
            document.getElementById('t-meta-display').innerText = `${timeControl} · ${format}`;
            saveState(); render();
        }

        function generateRoundRobinSchedules() {
            let list = [...players].sort((a, b) => b.rating - a.rating);
            if (list.length % 2 !== 0) list.push({ name: "BYE", id: "BYE_DUMMY", rating: 0, score: 0 });
            for (let r = 0; r < list.length - 1; r++) {
                let roundPairings = [];
                for (let i = 0; i < list.length / 2; i++) {
                    const p1 = list[i], p2 = list[list.length - 1 - i];
                    if (p1.id !== "BYE_DUMMY" && p2.id !== "BYE_DUMMY") roundPairings.push({ w: (i+r)%2===0 ? p1 : p2, b: (i+r)%2===0 ? p2 : p1, res: null });
                    else roundPairings.push({ w: p1.id === "BYE_DUMMY" ? p2 : p1, b: { name: "BYE", id: "BYE_DUMMY", rating: 0 }, res: "bye_win" });
                }
                rrSchedules.push(roundPairings);
                list.splice(1, 0, list.pop());
            }
        }

        function generatePairings() {
            if (format === 'rr') return rrSchedules[currentRound - 1].map(m => ({ w: players.find(p => p.id === m.w.id) || m.w, b: players.find(p => p.id === m.b.id) || m.b, res: m.res }));
            let pool = [...players].sort((a, b) => b.rating - a.rating);
            let roundPairings = [];
            if (pool.length % 2 !== 0) {
                let byePlayer = pool.splice(pool.findIndex(p => !receivedBye.has(p.id)) || 0, 1)[0];
                roundPairings.push({ w: byePlayer, b: { name: "BYE", id: "BYE_DUMMY", rating: 0 }, res: "bye_win" });
            }
            let scoreGroups = {}, sortedScores = [...new Set(pool.map(p => p.score))].sort((a, b) => b - a);
            sortedScores.forEach(s => scoreGroups[s] = pool.filter(p => p.score === s).sort((a,b) => b.rating - a.rating));
            pairBrackets(Object.values(scoreGroups), 0, roundPairings);
            return roundPairings;
        }

        function pairBrackets(groups, idx, pairings) {
            if (idx >= groups.length) return true;
            let group = groups[idx];
            if (group.length % 2 !== 0 && idx < groups.length - 1) {
                let p = group.pop(); groups[idx+1].push(p); groups[idx+1].sort((a,b) => b.rating - a.rating);
            }
            for (let i = 0; i < group.length; i += 2) pairings.push({ w: group[i], b: group[i+1], res: null });
            return pairBrackets(groups, idx + 1, pairings);
        }

        function render() {
            document.getElementById('round-title').innerText = currentRound <= totalRounds ? `Round ${currentRound} of ${totalRounds}` : "Tournament Complete";
            document.getElementById('pairings-list').innerHTML = pairings.map((m, i) => m.res === "bye_win" ? `<div class="match-card" style="border-left-color: var(--go);"><strong>${m.w.name}</strong> has a <strong>BYE</strong></div>` : `
                <div class="match-card">
                    <div><strong>${m.w.name}</strong> vs <strong>${m.b.name}</strong></div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <button class="res-btn ${m.res === 'w' ? 'active' : ''}" onclick="setRes(${i}, 'w')">1-0</button>
                        <button class="res-btn ${m.res === 'd' ? 'active' : ''}" onclick="setRes(${i}, 'd')">1/2</button>
                        <button class="res-btn ${m.res === 'b' ? 'active' : ''}" onclick="setRes(${i}, 'b')">0-1</button>
                    </div>
                </div>`).join('');
            document.getElementById('next-btn').style.display = (pairings.every(m => m.res) && currentRound <= totalRounds) ? 'block' : 'none';
            document.getElementById('dl-btn').style.display = currentRound > totalRounds ? 'block' : 'none';
            document.getElementById('standings-list').innerHTML = [...players].sort((a, b) => b.score - a.score).map(p => `<div style="padding:2px 0;">${p.name}: ${p.score}</div>`).join('');
        }

        function setRes(i, res) { pairings[i].res = res; if (format === 'rr') rrSchedules[currentRound-1][i].res = res; saveState(); render(); }
        function processRound() {
            pairings.forEach(m => {
                let w = players.find(p => p.id === m.w.id), b = players.find(p => p.id === m.b.id);
                if (m.res === 'w' || m.res === 'bye_win') w.score += 1;
                else if (m.res === 'b') b.score += 1;
                else if (m.res === 'd') { w.score += 0.5; b.score += 0.5; }
                if (b && b.id !== "BYE_DUMMY") playedPairs.add(`${w.id}-${b.id}`); else if (w) receivedBye.add(w.id);
            });
            currentRound++; pairings = generatePairings(); saveState(); render();
        }
        function downloadResults() { alert("Results ready to download"); }
        function goToMainMenu() { window.location.href = 'index.html'; }
        function resetTournament() { if(confirm("Clear all data?")) { localStorage.removeItem('chess_tournament_state'); location.reload(); } }
        window.onload = load;
    </script>
</body>
</html>
