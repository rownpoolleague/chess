<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SSCC PGN Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- Chessboard.js + Chess.js -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<style>
    body {
        background: #000;
        color: #eee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 15px;
    }
    #board {
        width: 340px;
        margin: 0 auto;
        border: 2px solid #333;
    }
    #controls {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 12px;
    }
    #controls button {
        padding: 8px 14px;
        background: #222;
        border: 1px solid #444;
        color: #eee;
        border-radius: 4px;
        cursor: pointer;
    }
    #controls button:hover {
        border-color: #3b82f6;
        color: #3b82f6;
    }
    #moveList {
        margin-top: 20px;
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 14px;
    }
</style>
</head>

<body>

<h2>SSCC PGN Viewer</h2>

<input type="file" id="pgnUpload" accept=".pgn">

<div id="board"></div>

<div id="controls">
    <button onclick="firstMove()">⏮</button>
    <button onclick="prevMove()">◀</button>
    <button onclick="nextMove()">▶</button>
    <button onclick="lastMove()">⏭</button>
</div>

<pre id="moveList"></pre>

<script>
let chess = new Chess();
let moves = [];
let index = 0;

let board = Chessboard('board', {
    position: 'start',
    draggable: false
});

document.getElementById("pgnUpload").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    const text = await file.text();

    chess = new Chess();
    chess.load_pgn(text);

    moves = chess.history({ verbose: true });
    index = 0;

    board.position("start");
    renderMoveList();
});

function renderMoveList() {
    const list = moves.map((m, i) =>
        `${i+1}. ${m.san}${i === index-1 ? " ←" : ""}`
    ).join("\n");

    document.getElementById("moveList").textContent = list;
}

function nextMove() {
    if (index >= moves.length) return;
    chess.move(moves[index]);
    index++;
    board.position(chess.fen());
    renderMoveList();
}

function prevMove() {
    if (index <= 0) return;
    chess.undo();
    index--;
    board.position(chess.fen());
    renderMoveList();
}

function firstMove() {
    chess.reset();
    index = 0;
    board.position("start");
    renderMoveList();
}

function lastMove() {
    chess.reset();
    for (let i = 0; i < moves.length; i++) chess.move(moves[i]);
    index = moves.length;
    board.position(chess.fen());
    renderMoveList();
}
</script>

</body>
</html>
