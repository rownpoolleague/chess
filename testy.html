<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TOURNAMENT ENGINE</title>
    <style>
        :root { --bg: #000; --card: #111; --accent: #3b82f6; --text: #eee; --go: #22c55e; --danger: #b91c1c; --neutral: #333; }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; background-color: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .form-wrapper { width: 100%; height: 100dvh; border: 4px solid #1e90ff; border-radius: 32px; display: flex; flex-direction: column; overflow: hidden; padding-top: calc(env(safe-area-inset-top, 2px) + 1px); padding-bottom: env(safe-area-inset-bottom, 2px); padding-left: env(safe-area-inset-left, 2px); padding-right: env(safe-area-inset-right, 2px); }
        .engine-box { flex: 1; background: var(--bg); padding: 15px; display: flex; flex-direction: column; overflow-y: auto; }
        select, input, .action-btn { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #333; background: #181818; color: white; font-size: 16px; }
        .action-btn { background: var(--go); border: none; font-weight: bold; cursor: pointer; }
        .p-label { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; cursor: pointer; color: var(--text); }
        .p-label input { width: auto; margin: 0 10px 0 0; }
        .match-card { background: #1a1a1a; padding: 15px; margin-bottom: 10px; border-radius: 4px; border-left: 4px solid #333; color: var(--text); }
        .res-btn { flex: 1; padding: 8px; background: #222; border: 1px solid #444; color: white; cursor: pointer; }
        .res-btn.active { background: var(--accent); }
        .standings { margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; font-size: 0.9rem; color: var(--text); margin-bottom: 20px; }
        .util-row { display: flex; gap: 10px; margin-top: auto; padding-top: 15px; border-top: 1px solid #222; }
        .util-btn { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; color: #fff; background: var(--neutral); border: 1px solid #444; border-radius: 4px; cursor: pointer; }
        .util-btn.reset-color { background: var(--danger); border-color: #991b1b; }
        #t-meta-display { font-size: 1rem; color: #888; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        #t-name-display { font-size: 1.25rem; font-weight: 800; color: #1e90ff; text-transform: uppercase; margin-bottom: 2px; letter-spacing: 0.5px; }
    </style>
</head>

<body>
    <div class="form-wrapper">
        <div class="engine-box">
            <div id="setup-view">
                <input type="text" id="t-name-input" placeholder="Tournament Name" autocomplete="off">
                <select id="tc-select" onchange="updateRosterRatings()">
                    <option value="regular">Regular Rating</option>
                    <option value="quick">Quick Rating</option>
                    <option value="blitz">Blitz Rating</option>
                </select>
                <select id="fmt" onchange="toggleRounds()">
                    <option value="swiss">Swiss</option>
                    <option value="rr">Round Robin</option>
                </select>
                <input type="number" id="rnd-count" placeholder="Number of Rounds" value="3">
                <div id="roster-list" style="max-height: 50vh; overflow-y: auto; background: #000; padding: 10px; border-radius: 4px;"></div>
                <button class="action-btn" style="margin-top: 10px;" onclick="startTournament()">BEGIN</button>
            </div>
            <div id="active-view" style="display: none;">
                <div id="t-name-display"></div>
                <div id="t-meta-display"></div>
                <div id="round-title" style="font-weight: bold; margin-bottom: 10px; color: var(--text);"></div>
                <div id="pairings-list"></div>
                <button id="next-btn" class="action-btn" style="display: none;" onclick="processRound()">NEXT ROUND</button>
                <button id="dl-btn" class="action-btn" style="display: none; background: #3b82f6;" onclick="downloadResults()">DOWNLOAD RESULTS</button>
                <div class="standings">
                    <div style="font-weight:bold; margin-bottom: 5px;">STANDINGS</div>
                    <div id="standings-list"></div>
                </div>
            </div>
            <div class="util-row">
                <button class="util-btn" onclick="goToMainMenu()">Main Menu</button>
                <button class="util-btn reset-color" onclick="resetTournament()">Reset Tournament</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxnwsrtu1gZL9FY76S8u9nfVx_4pbE-C4-SWY1Xx6opDiieS5RYR9O6ithRji1wrK8o/exec';
        let masterRoster = [], players = [], pairings = [], currentRound = 1, totalRounds = 0, format = '', history = [];
        let tournamentName = '', timeControl = 'regular';
        let playedPairs = new Set(), receivedBye = new Set(), rrSchedules = [];

        async function load() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                const playerArray = data.players ? data.players : data;
                masterRoster = playerArray.map(p => ({
                    id: p[0], name: p[0], ratings: { regular: parseRating(p[1]), quick: parseRating(p[2]), blitz: parseRating(p[3]) },
                    rating: 0, score: 0, colorScore: 0, colorHistory: []
                }));
                loadState();
                if (players.length === 0) updateRosterRatings();
            } catch (e) { loadState(); }
        }

        async function saveTournamentToSheet() {
            const payload = {
                action: 'saveTournament',
                name: tournamentName,
                format: format,
                tc: timeControl,
                state: localStorage.getItem('chess_tournament_state')
            };
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) { console.error("Save failed", e); }
        }

        function parseRating(val) { const p = parseInt(val); return isNaN(p) ? 0 : p; }

        function updateRosterRatings() {
            timeControl = document.getElementById('tc-select').value;
            masterRoster.forEach(p => p.rating = p.ratings[timeControl]);
            document.getElementById('roster-list').innerHTML = masterRoster.map(p => `<label class="p-label"><input type="checkbox" class="p-select" value="${p.id}"> ${p.name} (${p.rating || 'UNR'})</label>`).join('');
        }

        function toggleRounds() { document.getElementById('rnd-count').style.display = document.getElementById('fmt').value === 'rr' ? 'none' : 'block'; }

        function saveState() {
            const state = { tournamentName, timeControl, players, pairings, currentRound, totalRounds, format, history, playedPairs: Array.from(playedPairs), receivedBye: Array.from(receivedBye), rrSchedules };
            localStorage.setItem('chess_tournament_state', JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem('chess_tournament_state');
            if (!saved) return;
            const state = JSON.parse(saved);
            Object.assign(window, state);
            playedPairs = new Set(state.playedPairs);
            receivedBye = new Set(state.receivedBye);
            if (players.length > 0) {
                document.getElementById('setup-view').style.display = 'none';
                document.getElementById('active-view').style.display = 'block';
                render();
            }
        }

        async function startTournament() {
            const selectedIds = Array.from(document.querySelectorAll('.p-select:checked')).map(cb => cb.value);
            if (selectedIds.length < 2) return alert("Select at least 2 players");
            tournamentName = document.getElementById('t-name-input').value.trim() || 'TOURNAMENT';
            timeControl = document.getElementById('tc-select').value;
            format = document.getElementById('fmt').value;
            players = masterRoster.filter(p => selectedIds.includes(p.id)).map(p => ({ ...p, score: 0, colorScore: 0, colorHistory: [] }));
            currentRound = 1; history = []; playedPairs.clear(); receivedBye.clear();
            if (format === 'rr') { totalRounds = players.length; generateRoundRobinSchedules(); }
            else { totalRounds = parseInt(document.getElementById('rnd-count').value) || 3; }
            pairings = generatePairings();
            saveState();
            await saveTournamentToSheet(); // Send to Google Sheets
            document.getElementById('setup-view').style.display = 'none';
            document.getElementById('active-view').style.display = 'block';
            render();
        }

        // Add standard functions (generateRoundRobinSchedules, generatePairings, etc. remain the same)
        // ... (Keep existing logic here) ...

        function render() { /* Existing render logic */ }
        function setRes(i, res) { pairings[i].res = res; saveState(); render(); }
        function processRound() { /* Existing process logic */ }
        function downloadResults() { /* Existing download logic */ }
        function goToMainMenu() { window.location.href = 'index.html'; }
        function resetTournament() { localStorage.removeItem('chess_tournament_state'); location.reload(); }

        window.onload = load;
    </script>
</body>
</html>
