<!DOCTYPE html>
<html lang="en">
<head>
    <script src="asfa.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tournament Viewer</title>

    <style>
        html {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #000;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            height: 100%;
            overflow-y: auto;
            overscroll-behavior-y: none;
            /* Removed padding-top safe-area calculation to stop the gap */
            padding-top: 20px; 
        }

        h1 {
            text-align: center;
            margin: 10px 0 20px 0;
            font-size: 32px;
            font-weight: bold;
        }

        #content {
            width: 100%;
            margin: auto;
            padding-bottom: 40px;
        }

        .round {
            background: #111;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .round h2 {
            margin-top: 0;
            color: #1e90ff;
            font-size: 28px;
            margin-bottom: 25px;
            text-align: center;
        }

        .section-title {
            text-align: center;
            font-size: 22px;
            margin: 25px 0 15px 0;
            color: #f7d14f;
            font-weight: bold;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
        }

        .pairing {
            text-align: center;
            padding: 18px 0;
            border-bottom: 1px solid #222;
            font-size: 20px;
        }

        .score-row {
            text-align: center;
            padding: 12px 0;
            border-bottom: 1px solid #222;
            font-size: 20px;
        }

        .score-row:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>

<h1>Tournament Viewer</h1>

<div id="content">Loading tournament data…</div>

<script>
async function loadTournamentData() {
    try {
        const resp = await fetch(APP_CONFIG.APPSCRIPT_URL + "?action=tournament");
        if (!resp.ok) throw new Error("Server error");
        
        const data = await resp.json();
        const rows = data.rounds;
        const last = rows[rows.length - 1];

        const rounds = [{
            round: last.round,
            pairings: JSON.parse(last.white),
            scores: JSON.parse(last.black)
        }];

        renderTournament(rounds);

    } catch (err) {
        console.error("Fetch failed, keeping current view:", err);
    }
}

function renderTournament(rounds) {
    const container = document.getElementById("content");
    container.innerHTML = "";

    rounds.forEach(r => {
        const div = document.createElement("div");
        div.className = "round";

        div.innerHTML = `<h2>Round ${r.round}</h2>`;

        div.innerHTML += `<div class="section-title">Pairings</div>`;
        r.pairings.forEach(p => {
            div.innerHTML += `
                <div class="pairing">
                    <strong>${p.white}</strong> vs <strong>${p.black}</strong>
                    <br><span style="color:#888; font-size: 0.85em;">Result: ${p.result === null ? "—" : p.result}</span>
                </div>
            `;
        });

        div.innerHTML += `<div class="section-title">Standings</div>`;
        div.innerHTML += `<div class="scores"></div>`;
        const scoreBox = div.querySelector(".scores");

        const sortedStandings = [...r.scores].sort((a, b) => b.score - a.score);

        sortedStandings.forEach((s, i) => {
            scoreBox.innerHTML += `
                <div class="score-row">
                    ${i + 1}. ${s.name}: <strong>${s.score}</strong>
                </div>
            `;
        });

        container.appendChild(div);
    });
}

loadTournamentData();
setInterval(loadTournamentData, 10000); 
</script>

</body>
</html>
