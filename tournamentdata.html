<!DOCTYPE html>
<html lang="en">
<head>
    <script src="asfa.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tournament Viewer</title>

    <style>
        body {
            background: #000;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            /* Prevents bounce scrolling and ensures full height fit */
            height: 100dvh;
            overflow-y: auto;
        }

        h1 {
            text-align: center;
            margin: 10px 0;
            font-size: 28px;
            font-weight: bold;
        }

        #content {
            width: 100%;
            margin: 0 auto;
            padding-bottom: 20px;
        }

        .round {
            background: #111;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .round h2 {
            margin-top: 0;
            color: #1e90ff;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* SECTION HEADERS */
        .section-title {
            text-align: center;
            font-size: 20px;
            margin: 25px 0 15px 0;
            color: #f7d14f;
            font-weight: bold;
            padding-bottom: 8px;
            border-bottom: 2px solid #444;
        }

        /* PAIRINGS */
        .pairing {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid #222;
            font-size: 19px; /* Larger text for phones */
        }

        /* SCORES / RESULTS */
        .scores {
            margin-top: 5px;
        }

        .score-row {
            text-align: center;
            padding: 12px 0;
            border-bottom: 1px solid #222;
            font-size: 19px; /* Larger text for phones */
        }

        .score-row:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>

<h1>Tournament Viewer</h1>

<div id="content">Loading…</div>

<script>
async function loadTournamentData() {
    try {
        const resp = await fetch(APP_CONFIG.APPSCRIPT_URL + "?action=tournament");
        const data = await resp.json();

        const rows = data.rounds;

        // ⭐ Only show the last row
        const last = rows[rows.length - 1];

        const rounds = [{
            round: last.round,
            pairings: JSON.parse(last.white),
            scores: JSON.parse(last.black)
        }];

        renderTournament(rounds);

    } catch (err) {
        document.getElementById("content").innerHTML = "Failed to load tournament data.";
        console.error(err);
    }
}

function renderTournament(rounds) {
    const container = document.getElementById("content");
    container.innerHTML = "";

    rounds.forEach(r => {
        const div = document.createElement("div");
        div.className = "round";

        div.innerHTML = `<h2>Round ${r.round}</h2>`;

        // ⭐ PAIRINGS SECTION
        div.innerHTML += `<div class="section-title">Pairings</div>`;
        r.pairings.forEach(p => {
            div.innerHTML += `
                <div class="pairing">
                    <strong>${p.white}</strong> vs <strong>${p.black}</strong>
                    <br><span style="color:#888; font-size: 0.85em;">Result: ${p.result === null ? "—" : p.result}</span>
                </div>
            `;
        });

        // ⭐ RESULTS SECTION
        div.innerHTML += `<div class="section-title">Standings</div>`;
        div.innerHTML += `<div class="scores"></div>`;
        const scoreBox = div.querySelector(".scores");

        // ⭐ Sort standings by score DESC
        const sortedStandings = [...r.scores].sort((a, b) => b.score - a.score);

        // ⭐ Render standings
        sortedStandings.forEach((s, i) => {
            scoreBox.innerHTML += `
                <div class="score-row">
                    ${i + 1}. ${s.name}: <strong>${s.score}</strong>
                </div>
            `;
        });

        container.appendChild(div);
    });
}

loadTournamentData();
setInterval(loadTournamentData, 5000);

</script>

</body>
</html>
