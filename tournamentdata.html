<!DOCTYPE html>
<html>
<head>
    <script src="asfa.js"></script>
    <meta charset="UTF-8">
    <title>Tournament Viewer</title>

    <style>
        body {
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            margin: 30px 0;
            font-size: 60px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #content {
            width: 95%;
            max-width: 1800px;
            margin: auto;
        }

        .round {
            background: #1c1c1c;
            padding: 40px;
            margin-bottom: 40px;
            border-radius: 14px;
            border: 1px solid #333;
            font-size: 34px;
        }

        .round h2 {
            margin-top: 0;
            color: #4fc3f7;
            font-size: 50px;
            margin-bottom: 30px;
            text-align: center;
        }

        /* SECTION HEADERS */
        .section-title {
            font-size: 42px;
            margin: 25px 0 15px 0;
            color: #f7d14f;
            font-weight: bold;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
        }

        /* PAIRINGS */
        .pairing {
            padding: 20px 0;
            border-bottom: 1px solid #333;
            font-size: 38px;
            line-height: 1.4;
        }

        .pairing:last-child {
            border-bottom: none;
        }

        /* SCORES / RESULTS */
        .scores {
            margin-top: 30px;
            padding: 25px;
            background: #222;
            border-radius: 12px;
            font-size: 36px;
        }

        .score-row {
            padding: 12px 0;
            border-bottom: 1px solid #333;
        }

        .score-row:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>

<h1>Tournament Viewer</h1>

<div id="content">Loading…</div>

<script>
async function loadTournamentData() {
    try {
        const resp = await fetch(APP_CONFIG.APPSCRIPT_URL + "?action=tournament");
        const data = await resp.json();

        const rows = data.rounds;

        // ⭐ Only show the last row
        const last = rows[rows.length - 1];

        const rounds = [{
            round: last.round,
            pairings: JSON.parse(last.white),
            scores: JSON.parse(last.black)
        }];

        renderTournament(rounds);

    } catch (err) {
        document.getElementById("content").innerHTML = "Failed to load tournament data.";
        console.error(err);
    }
}

function renderTournament(rounds) {
    const container = document.getElementById("content");
    container.innerHTML = "";

    rounds.forEach(r => {
        const div = document.createElement("div");
        div.className = "round";

        div.innerHTML = `<h2>Round ${r.round}</h2>`;

        // ⭐ PAIRINGS SECTION
        div.innerHTML += `<div class="section-title">Pairings</div>`;
        r.pairings.forEach(p => {
            div.innerHTML += `
                <div class="pairing">
                    <strong>${p.white}</strong> vs <strong>${p.black}</strong>
                    <br>Result: ${p.result === null ? "—" : p.result}
                </div>
            `;
        });

        // ⭐ RESULTS SECTION
        div.innerHTML += `<div class="section-title">Standings</div>`;
        div.innerHTML += `<div class="scores"></div>`;
        const scoreBox = div.querySelector(".scores");

      // ⭐ Sort standings by score DESC
const sortedStandings = [...r.scores].sort((a, b) => b.score - a.score);

// ⭐ Render standings
sortedStandings.forEach((s, i) => {
    scoreBox.innerHTML += `
        <div class="score-row">
            ${i + 1}. ${s.name}: ${s.score}
        </div>
    `;
});


        container.appendChild(div);
    });
}

loadTournamentData();
setInterval(loadTournamentData, 5000);

</script>

</body>
</html>
