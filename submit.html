<!DOCTYPE html>
<html lang="en">
<head>
    <script src="asfa.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUBMIT MATCH</title>
    <style>
        :root { --bg: #000; --card: #111; --accent: #3b82f6; --text: #eee; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        header { padding: 10px 0; text-align: center; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 1.2rem; color: var(--accent); letter-spacing: 1px; }

        /* The "On Screen" Style */
        select { 
            width: 100%; 
            padding: 10px; 
            margin: 5px 0; 
            background: #151515; 
            border: 1px solid #222; 
            color: #ccc; 
            border-radius: 4px; 
            font-size: 0.9rem;
            appearance: none; /* Removes default styling */
            -webkit-appearance: none;
        }

        .action-btn { 
            width: 100%; 
            padding: 12px; 
            background: var(--accent); 
            border: none; 
            color: white; 
            font-weight: bold; 
            border-radius: 4px; 
            margin-top: 15px; 
        }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; align-items: center; justify-content: center; }
        .modal-box { background: #111; border: 1px solid #222; width: 80%; padding: 20px; text-align: center; border-radius: 8px; }
    </style>
</head>
<body>

<header><h1>SUBMIT MATCH</h1></header>

<div id="confirmation-modal" class="modal-overlay">
    <div class="modal-box">
        <p id="modal-text">Processing...</p>
        <button class="action-btn" onclick="closeModal()">OK</button>
    </div>
</div>

<div id="view-match">
    <select id="format"><option value="Regular">Format: Regular</option><option value="Quick">Format: Quick</option><option value="Blitz">Format: Blitz</option></select>
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <select id="p1-select"><option value="">White</option></select>
        <select id="p2-select"><option value="">Black</option></select>
    </div>
    
    <select id="opening">
        <option value="" disabled selected>Opening...</option>
        <option value="A00">Flank (A00)</option><option value="B01">Scandinavian (B01)</option>
        <option value="B10">Caro-Kann (B10)</option><option value="B20">Sicilian (B20)</option>
        <option value="C00">French (C00)</option><option value="C41">Philidor (C41)</option>
        <option value="C50">Italian (C50)</option><option value="C60">Ruy Lopez (C60)</option>
        <option value="D00">Queen's Pawn (D00)</option><option value="D02">London (D02)</option>
        <option value="D06">Queen's Gambit (D06)</option><option value="E00">Indian (E00)</option>
    </select>

    <select id="result">
        <option value="" disabled selected>Result...</option>
        <option value="1-0">White Wins (1-0)</option>
        <option value="0.5-0.5">Draw (½-½)</option>
        <option value="0-1">Black Wins (0-1)</option>
    </select>
    
    <button class="action-btn" onclick="submitMatch()">SUBMIT</button>
</div>

<script>
    let allPlayers = [];

    async function loadPlayers() {
        try {
            const resp = await fetch(APP_CONFIG.APPSCRIPT_URL);
            allPlayers = await resp.json();
            updatePlayerDropdowns();
        } catch (e) { console.error("Load failed"); }
    }

    function updatePlayerDropdowns() {
        const opt = allPlayers.map(p => `<option value="${p[0]}">${p[0]}</option>`).join('');
        document.getElementById('p1-select').innerHTML = '<option value="">White</option>' + opt;
        document.getElementById('p2-select').innerHTML = '<option value="">Black</option>' + opt;
    }

    async function submitMatch() {
        const d = { 
            action: 'addMatch', 
            p1: document.getElementById('p1-select').value, 
            p2: document.getElementById('p2-select').value, 
            opening: document.getElementById('opening').value, 
            result: document.getElementById('result').value, 
            format: document.getElementById('format').value 
        };
        document.getElementById('confirmation-modal').style.display = 'flex';
        try {
            await fetch(APP_CONFIG.APPSCRIPT_URL, { method: 'POST', body: JSON.stringify(d) });
            document.getElementById('modal-text').innerText = "Match Recorded!";
            document.getElementById('p1-select').value = "";
            document.getElementById('p2-select').value = "";
        } catch (e) { document.getElementById('modal-text').innerText = "Error - Try Again"; }
    }

    function closeModal() { document.getElementById('confirmation-modal').style.display = 'none'; }
    window.onload = loadPlayers;
</script>
</body>
</html>
