<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Club Main Menu</title>
<link rel="manifest" href="manifest.json">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    background-color: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.form-wrapper {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    height: 100dvh; 
    background-color: #000;
    border: 4px solid #1e90ff;
    border-radius: 12px;
    background-clip: padding-box;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 12px);
    padding-bottom: env(safe-area-inset-bottom, 12px);
    padding-left: env(safe-area-inset-left, 4px);
    padding-right: env(safe-area-inset-right, 4px);
}

.overlay {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20px 10px;
}

h1 {
    text-align: center;
    color: white;
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 32px;
}

.menu-container {
    max-width: 500px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.menu-button {
    display: block;
    margin-left: auto;
    margin-right: auto;
    text-align: center;
    padding: 4px;
    background: #1e90ff;
    color: white;
    text-decoration: none;
    font-size: 24px;
    border-radius: 8px;
    font-weight: bold;
    height: 36px;
    line-height: 28px;
    width: 250px;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 10px 20px 20px 20px;
    margin-top: auto;
}

.footer-logo {
    max-width: 200px;
    max-height: 10dvh; 
    height: auto;
    width: auto;
}
</style>
</head>

<body>

    <div class="form-wrapper">
        <div class="overlay">
            <h1>Tournament Menu</h1>
            <div class="menu-container">                
               <a class="menu-button" href="addplayer.html">Add Player</a>
                <a class="menu-button" href="tournament.html">Start Tournament</a>
                <a class="menu-button" href="index.html">Main Menu</a>
            </div>
        </div>
        <footer>
            <img src="iconking.png" alt="Club Logo" class="footer-logo">
        </footer>
    </div>

    <script>
        // Security gatekeeper: Redirects if not authenticated
        if (sessionStorage.getItem("adminAuth") !== "ok") {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
