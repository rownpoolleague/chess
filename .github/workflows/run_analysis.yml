name: Run Chess Analysis

on:
  push:
    paths:
      - '**/*.pgn'
      - '*.pgn'
  workflow_dispatch: # Allows you to trigger it with a button click anytime

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Pattern Finder
      run: python analyze.py
